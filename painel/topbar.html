<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu</title>
<style>
  /* Barra superior do FreeMix, na disposição de uma mesa de produção: Preset à esquerda, Tela Cheia no centro,
     Pausar Entradas / Básico / Configurar / ? à direita. Cada botão executa algo real; as janelas abrem na mesa
     de baixo porque esta barra é baixa demais para mostrá-las. */
  :root { --bar: #0a0f14; --btn: #293038; --btn-h: #404b56; --bd: #607081; --tx: #f2f5f8; --on: #006400; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bar); color: var(--tx); font: 700 11px/1 "Segoe UI", Tahoma, Arial, sans-serif; user-select: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 4px; overflow: hidden; white-space: nowrap; }
  .grp { display: flex; align-items: center; gap: 4px; } .grp.r { justify-content: flex-end; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .b { height: 22px; min-width: 74px; padding: 0 10px; background: var(--btn); border: 1px solid var(--bd); display: inline-flex; align-items: center; justify-content: center; }
  .b:hover { background: var(--btn-h); } .b.on { background: var(--on); border-color: #2fb02c; }
  .b:disabled { color: #6b7480; background: #1b2229; border-color: #2c353e; cursor: default; }
  .b.dd { min-width: 0; width: 15px; padding: 0; margin-left: -5px; border-left-color: #1b2229; font-size: 8px; }
  .b.sq { min-width: 0; width: 24px; padding: 0; }
  .clk { display: inline-flex; gap: 10px; margin-left: 10px; padding: 0 10px; height: 22px; align-items: center; background: #000; border: 1px solid #f2f5f8; font: 700 12px Consolas, monospace; } .clk b { color: #5a636e; } .clk b.on { color: #ff5a4f; } .clk b.now { color: #f2f5f8; } .clk b.amber { color: #ffb300; } .clk b.green { color: #3fd145; } .clk b[hidden] { display: none; }
  .lab { padding: 0 14px 0 10px; font-size: 12px; }
body:not(.clocks-only) .clk { display:none; }
body.clocks-only { display:block; padding:0; }
body.clocks-only .grp { display:none; }
body.clocks-only .grp:nth-of-type(2) { display:block; }
body.clocks-only button { display:none; }
body.clocks-only .clk { position:fixed; top:0; left:0; right:0; height:88px; margin:0; padding:3px; display:flex; flex-direction:column; justify-content:space-evenly; gap:2px; font-size:12px; }
body.clocks-only .clk b.now { font-size:22px; }
.rapid-talk { display:none; }
body.clocks-only .rapid-talk { display:grid; position:fixed; top:90px; left:0; right:0; height:30px; grid-template-columns:minmax(0,1fr) 22px; gap:2px; }
.rapid-talk select { width:100%; min-width:0; background:#293038; color:#fff; border:1px solid #607081; font:11px 'Segoe UI',sans-serif; }
body.clocks-only .rapid-talk button { display:block; width:100%; min-width:0; height:30px; background:#404b56; border:1px solid #607081; color:#fff; font:700 11px 'Segoe UI',sans-serif; padding:0; touch-action:none; }
.rapid-talk button:disabled { color:#a5acb4; background:#293038; cursor:default; }
.rapid-talk button.active { background:#ff0000 !important; color:#fff; }
.rapid-talk small { white-space:normal; overflow:hidden; font:10px/11px 'Segoe UI',sans-serif; color:#b8c4d0; }
</style>
</head>
<body>
  <div class="grp">
    <span class="lab" id="lab" title="Preset em uso">Preset</span>
    <button class="b" data-open="presets" data-arg="new" title="Criar uma produção nova, vazia">Novo</button>
    <button class="b" data-open="presets" title="Abrir uma produção salva">Abrir</button><button class="b dd" data-open="presets" title="Produções salvas">▼</button>
    <button class="b" data-do="presetsave" title="Confirma que a produção em uso está gravada">Salvar</button>
    <button class="b" data-open="saveas" title="Grava uma cópia da produção com outro nome e passa a usá-la">Salvar como</button><button class="b dd" data-open="saveas" title="Salvar como">▼</button>
    <button class="b" data-do="presetlast" title="Volta para a produção usada antes desta">Último</button>
  </div>
  <div class="grp">
    <button class="b" data-do="fullscreen" title="Output em tela cheia no segundo monitor (em janela, se houver só um)">Tela Cheia</button><button class="b dd" data-open="ext" title="Central de saídas">▼</button>
    <span class="clk" id="clk" title="Relógios de produção. Duplo clique: escolher o que cada um mostra (relógio, evento, gravação, transmissão, tempo restante)."><b id="k-rec">REC 00:00:00</b><b id="k-str">NO AR 00:00:00</b><b id="k-now" class="now"></b></span>
  </div>
  <div class="grp r">
    <button class="b" data-open="datasources" title="Tabelas CSV, JSON e Excel vinculadas ao GC">Dados</button>
    <button class="b" data-open="compositions" title="Criar entrevista, PiP e trocar os participantes por slots">Compor</button><button class="b" data-open="calls" title="Convidados, retorno e mic privado">Calls</button>
    <button class="b" id="b-pause" data-do="pausethumbs" title="Pausa todas as entradas de vídeo que estão tocando">Pausar Entradas</button>
    <button class="b" id="b-basic" data-do="basic" title="Mostra ou esconde os botões avançados da janela">Básico</button>
    <button class="b" data-open="settings" title="Configurações FreeMix">Configurar</button><button class="b dd" data-open="cfgmenu" title="Todas as configurações">▼</button>
    <button class="b sq" data-open="help" title="Ajuda">?</button>
  </div>

  <div class="rapid-talk" id="rapid-talk">
    <button id="talk-hold" disabled title="Segure para falar. Soltar fecha o microfone privado.">Talkback</button>
    <button class="b sq" id="talk-settings" data-open="calls" aria-label="Configurar Talkback" title="Microfone privado e convidados do botão Talkback">⋮</button>
    <small id="talk-status" role="status" hidden>Configure o mic em Calls.</small>
  </div>
<script src="local.js"></script>
<script src="talkback-rapido.js"></script>
<script>
  "use strict";
  const $ = (id) => document.getElementById(id), LOCAL = window.MESA_LOCAL || {};
  if(new URLSearchParams(location.search).get("mode")==="clocks")document.body.classList.add("clocks-only");
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const sha = async (text) => b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)));
  let ws = null, seq = 0, on = false;
  const pending = new Map();
  const req = (type, data) => new Promise((res, rej) => {
    if (!on) return rej(new Error("sem conexão com o motor"));
    const id = String(++seq); pending.set(id, { res, rej });
    ws.send(JSON.stringify({ op: 6, d: { requestType: type, requestId: id, requestData: data } }));
  });
  const paint = () => { for (const b of document.querySelectorAll(".b")) b.disabled = !on; };
  const tell = (msg) => req("BroadcastCustomEvent", { eventData: { freemix: msg } });
  function connect() {
    const mine = ws = new WebSocket(LOCAL.url || "ws://127.0.0.1:4455");
    mine.onmessage = async (ev) => {
      const m = JSON.parse(ev.data);
      if (m.op === 0) {
        const d = { rpcVersion: 1, eventSubscriptions: 1 | 2 }, a = m.d.authentication; // geral (recados da mesa) e configuração (troca de preset)
        if (a) d.authentication = await sha((await sha((LOCAL.password || "") + a.salt)) + a.challenge);
        mine.send(JSON.stringify({ op: 1, d }));
      } else if (m.op === 2) {
        on = true; paint();
        req("GetSceneCollectionList").then((c) => { $("lab").title = "Preset em uso: " + c.currentSceneCollectionName; }).catch(() => {});
        tell({ do: "state" }).catch(() => {}); // ask the panel which toggles are on
        loadClocks();
      } else if (m.op === 5) {
        const d = m.d.eventData || {};
        if (m.d.eventType === "CurrentSceneCollectionChanged") $("lab").title = "Preset em uso: " + d.sceneCollectionName;
        else if (m.d.eventType === "CustomEvent" && d.freemix && Array.isArray(d.freemix.clocks)) clocks = d.freemix.clocks;
        else if (m.d.eventType === "CustomEvent" && d.freemix && d.freemix.state) { $("b-pause").classList.toggle("on", !!d.freemix.state.paused); $("b-basic").classList.toggle("on", !!d.freemix.state.basic); }
      } else if (m.op === 7) {
        const p = pending.get(m.d.requestId); if (!p) return;
        pending.delete(m.d.requestId);
        m.d.requestStatus.result ? p.res(m.d.responseData || {}) : p.rej(new Error(m.d.requestStatus.comment || "falhou"));
      }
    };
    mine.onclose = () => { if (ws !== mine) return; for (const p of pending.values()) p.rej(new Error("conexão encerrada")); pending.clear(); on = false; paint(); setTimeout(connect, 2500); };
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".b"); if (!b || b.disabled) return;
    tell(b.dataset.open ? { open: b.dataset.open, arg: b.dataset.arg || null } : { do: b.dataset.do }).catch(() => {});
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  // Production clocks: three slots, each one a clock, an event countdown, the recording time, the streaming time or
  // the time left of the media on Output. They are set up in the panel (double click here opens that window) and
  // kept in the engine's persistent data, slot "freemix_clocks", so both panels read the same thing.
  const SLOTS = ["k-rec", "k-str", "k-now"];
  let clocks = [{ type: "rec" }, { type: "stream" }, { type: "clock" }], mediaName = "", mediaAt = 0;
  const two = (n) => String(n).padStart(2, "0"), hms = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${two(Math.floor(s / 3600))}:${two(Math.floor(s / 60) % 60)}:${two(s % 60)}`; };
  const todayAt = (hhmm) => { const m = /^(\d{1,2}):(\d{2})/.exec(hhmm || ""); if (!m) return null; const d = new Date(); d.setHours(+m[1], +m[2], 0, 0); return d.getTime(); };
  const loadClocks = () => req("GetPersistentData", { realm: "OBS_WEBSOCKET_DATA_REALM_GLOBAL", slotName: "freemix_clocks" }).then((r) => { if (Array.isArray(r.slotValue)) clocks = r.slotValue; }).catch(() => {});
  async function remaining() {
    if (Date.now() - mediaAt > 2000) {
      mediaAt = Date.now(); mediaName = "";
      const p = await req("GetCurrentProgramScene").catch(() => null), items = p ? await req("GetSceneItemList", { sceneName: p.currentProgramSceneName }).catch(() => null) : null;
      const m = ((items && items.sceneItems) || []).find((i) => /^(ffmpeg_source|vlc_source)$|playlist/.test(i.inputKind || "")); if (m) mediaName = m.sourceName;
    }
    if (!mediaName) return null;
    const s = await req("GetMediaInputStatus", { inputName: mediaName }).catch(() => null);
    return s && s.mediaDuration ? s.mediaDuration - s.mediaCursor : null;
  }
  async function clockText(c, rec, str) {
    if (c.type === "rec") return { text: "REC " + (rec && rec.outputActive ? rec.outputTimecode.slice(0, 8) : "00:00:00"), cls: rec && rec.outputActive ? "on" : "" };
    if (c.type === "stream") return { text: "NO AR " + (str && str.outputActive ? str.outputTimecode.slice(0, 8) : "00:00:00"), cls: str && str.outputActive ? "on" : "" };
    if (c.type === "remaining") { const r = on ? await remaining() : null; return { text: "RESTA " + (r == null ? "--:--:--" : hms(r)), cls: r == null ? "" : r < 10000 ? "on" : "now" }; }
    if (c.type === "event") {
      const now = Date.now(), a = todayAt(c.start), b = todayAt(c.end);
      if (a == null) return { text: "EVENTO --:--:--", cls: "" };
      if (now < a) return { text: "EVENTO -" + hms(a - now), cls: "amber" };                       // before the start: counts down, amber
      if (b != null && b > a) return now < b ? { text: "EVENTO " + hms(b - now), cls: "green" }    // during: time left, green
        : { text: "EVENTO +" + hms(now - b), cls: "on" };                                           // after the end: time since, red
      return { text: "EVENTO " + hms(now - a), cls: "green" };                                     // no end: time since the start, green
    }
    return { text: new Date(Date.now() + (+c.offset || 0) * 3600000).toLocaleTimeString("pt-BR", { hour12: !!c.ampm }), cls: "now" };
  }
  setInterval(async () => {
    const need = (t) => clocks.some((c) => c && c.type === t);
    const [rec, str] = on ? await Promise.all([need("rec") ? req("GetRecordStatus").catch(() => null) : null, need("stream") ? req("GetStreamStatus").catch(() => null) : null]) : [null, null];
    for (let i = 0; i < SLOTS.length; i++) {
      const el = $(SLOTS[i]), c = clocks[i] || { type: "none" };
      if (c.type === "none") { el.textContent = ""; el.hidden = true; continue; }
      const r = await clockText(c, rec, str); el.hidden = false; el.textContent = r.text; el.className = r.cls;
    }
  }, 1000);
  document.getElementById("clk").addEventListener("dblclick", () => tell({ open: "clocks" }).catch(() => {}));
  paint(); connect();
</script>
</body>
</html>
