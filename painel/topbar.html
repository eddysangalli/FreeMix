<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu</title>
<style>
  /* Barra superior do FreeMix, na disposição de uma mesa de produção: Preset à esquerda, Tela Cheia no centro,
     Pausar Entradas / Básico / Configurar / ? à direita. Cada botão executa algo real; as janelas abrem na mesa
     de baixo porque esta barra é baixa demais para mostrá-las. */
  :root { --bar: #0d1013; --btn: #2a3540; --btn-h: #364452; --bd: #4b5967; --tx: #f2f5f8; --on: #0e7a0d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bar); color: var(--tx); font: 700 11px/1 "Segoe UI", Tahoma, Arial, sans-serif; user-select: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 4px; overflow: hidden; white-space: nowrap; }
  .grp { display: flex; align-items: center; gap: 4px; } .grp.r { justify-content: flex-end; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .b { height: 22px; min-width: 74px; padding: 0 10px; background: var(--btn); border: 1px solid var(--bd); display: inline-flex; align-items: center; justify-content: center; }
  .b:hover { background: var(--btn-h); } .b.on { background: var(--on); border-color: #2fb02c; }
  .b:disabled { color: #6b7480; background: #1b2229; border-color: #2c353e; cursor: default; }
  .b.dd { min-width: 0; width: 15px; padding: 0; margin-left: -5px; border-left-color: #1b2229; font-size: 8px; }
  .b.sq { min-width: 0; width: 24px; padding: 0; }
  .clk { display: inline-flex; gap: 10px; margin-left: 10px; padding: 0 10px; height: 22px; align-items: center; background: #000; border: 1px solid #f2f5f8; font: 700 12px Consolas, monospace; } .clk b { color: #5a636e; } .clk b.on { color: #ff5a4f; } .clk #k-now { color: #f2f5f8; }
  .lab { padding: 0 14px 0 10px; font-size: 12px; }
</style>
</head>
<body>
  <div class="grp">
    <span class="lab" id="lab" title="Preset em uso">Preset</span>
    <button class="b" data-open="presets" data-arg="new" title="Criar uma produção nova, vazia">Novo</button>
    <button class="b" data-open="presets" title="Abrir uma produção salva">Abrir</button><button class="b dd" data-open="presets" title="Produções salvas">▼</button>
    <button class="b" data-do="presetsave" title="Confirma que a produção em uso está gravada">Salvar</button>
    <button class="b" data-open="saveas" title="Grava uma cópia da produção com outro nome e passa a usá-la">Salvar como</button><button class="b dd" data-open="saveas" title="Salvar como">▼</button>
    <button class="b" data-do="presetlast" title="Volta para a produção usada antes desta">Último</button>
  </div>
  <div class="grp">
    <button class="b" data-do="fullscreen" title="Output em tela cheia no segundo monitor (em janela, se houver só um)">Tela Cheia</button><button class="b dd" data-open="ext" title="Central de saídas">▼</button>
    <span class="clk" title="Relógio de produção: tempo de gravação, tempo de transmissão e hora"><b id="k-rec">REC 00:00:00</b><b id="k-str">NO AR 00:00:00</b><b id="k-now"></b></span>
  </div>
  <div class="grp r">
    <button class="b" id="b-pause" data-do="pausethumbs" title="Pausa todas as entradas de vídeo que estão tocando">Pausar Entradas</button>
    <button class="b" id="b-basic" data-do="basic" title="Mostra ou esconde os botões avançados da janela">Básico</button>
    <button class="b" data-open="config" title="Vídeo da produção">Configurar</button><button class="b dd" data-open="cfgmenu" title="Todas as configurações">▼</button>
    <button class="b sq" data-open="help" title="Ajuda">?</button>
  </div>

<script src="local.js"></script>
<script>
  "use strict";
  const $ = (id) => document.getElementById(id), LOCAL = window.MESA_LOCAL || {};
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const sha = async (text) => b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)));
  let ws = null, seq = 0, on = false;
  const pending = new Map();
  const req = (type, data) => new Promise((res, rej) => {
    if (!on) return rej(new Error("sem conexão com o motor"));
    const id = String(++seq); pending.set(id, { res, rej });
    ws.send(JSON.stringify({ op: 6, d: { requestType: type, requestId: id, requestData: data } }));
  });
  const paint = () => { for (const b of document.querySelectorAll(".b")) b.disabled = !on; };
  const tell = (msg) => req("BroadcastCustomEvent", { eventData: { freemix: msg } });
  function connect() {
    const mine = ws = new WebSocket(LOCAL.url || "ws://127.0.0.1:4455");
    mine.onmessage = async (ev) => {
      const m = JSON.parse(ev.data);
      if (m.op === 0) {
        const d = { rpcVersion: 1, eventSubscriptions: 1 | 2 }, a = m.d.authentication; // geral (recados da mesa) e configuração (troca de preset)
        if (a) d.authentication = await sha((await sha((LOCAL.password || "") + a.salt)) + a.challenge);
        mine.send(JSON.stringify({ op: 1, d }));
      } else if (m.op === 2) {
        on = true; paint();
        req("GetSceneCollectionList").then((c) => { $("lab").title = "Preset em uso: " + c.currentSceneCollectionName; }).catch(() => {});
        tell({ do: "state" }).catch(() => {}); // ask the panel which toggles are on
      } else if (m.op === 5) {
        const d = m.d.eventData || {};
        if (m.d.eventType === "CurrentSceneCollectionChanged") $("lab").title = "Preset em uso: " + d.sceneCollectionName;
        else if (m.d.eventType === "CustomEvent" && d.freemix && d.freemix.state) { $("b-pause").classList.toggle("on", !!d.freemix.state.paused); $("b-basic").classList.toggle("on", !!d.freemix.state.basic); }
      } else if (m.op === 7) {
        const p = pending.get(m.d.requestId); if (!p) return;
        pending.delete(m.d.requestId);
        m.d.requestStatus.result ? p.res(m.d.responseData || {}) : p.rej(new Error(m.d.requestStatus.comment || "falhou"));
      }
    };
    mine.onclose = () => { if (ws !== mine) return; for (const p of pending.values()) p.rej(new Error("conexão encerrada")); pending.clear(); on = false; paint(); setTimeout(connect, 2500); };
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".b"); if (!b || b.disabled) return;
    tell(b.dataset.open ? { open: b.dataset.open, arg: b.dataset.arg || null } : { do: b.dataset.do }).catch(() => {});
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  // Production clock: both counters come from the engine once a second.
  setInterval(async () => {
    $("k-now").textContent = new Date().toLocaleTimeString("pt-BR");
    if (!on) return;
    const [r, s] = await Promise.all([req("GetRecordStatus").catch(() => null), req("GetStreamStatus").catch(() => null)]);
    $("k-rec").textContent = "REC " + (r && r.outputActive ? r.outputTimecode.slice(0, 8) : "00:00:00"); $("k-rec").classList.toggle("on", !!(r && r.outputActive));
    $("k-str").textContent = "NO AR " + (s && s.outputActive ? s.outputTimecode.slice(0, 8) : "00:00:00"); $("k-str").classList.toggle("on", !!(s && s.outputActive));
  }, 1000);
  paint(); connect();
</script>
</body>
</html>
