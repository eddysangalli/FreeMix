<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FreeMix Studio</title>
<style>
  /* ==========================================================================
     FreeMix Studio - Interface Broadcast Unificada Estilo vMix
     Design System Profissional em Dark Mode com Modais Centralizados
     ========================================================================== */
  :root {
    --bg-main: #10141a;
    --bg-panel: #161c24;
    --bg-card: #1b222c;
    --bg-hover: #263140;
    --bg-active: #2f3d50;
    --border-subtle: #252e3b;
    --border-strong: #384659;
    --text-primary: #e6ebf2;
    --text-muted: #8fa0b5;
    --text-dim: #556275;

    /* Acentos Broadcast */
    --c-green: #00e676;
    --c-green-dark: #0a660e;
    --c-orange: #f7931e;
    --c-orange-dark: #b86200;
    --c-blue: #29b6f6;
    --c-blue-dark: #1565c0;
    --c-red: #ff3b30;
    --c-red-dark: #b71c1c;
    --c-purple: #ab47bc;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; }
  body {
    background: var(--bg-main);
    color: var(--text-primary);
    font: 12px/1.2 "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    display: grid;
    grid-template-rows: 34px auto minmax(0, 1fr) 34px 22px;
    overflow: hidden;
  }

  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }

  /* Scrollbars Estilizadas */
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: #0c0f14; }
  ::-webkit-scrollbar-thumb { background: #2f3847; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #445166; }

  /* Botões Base */
  .b {
    height: 25px; padding: 0 10px; background: #212934; border: 1px solid var(--border-strong);
    color: var(--text-primary); white-space: nowrap; display: inline-flex; align-items: center;
    justify-content: center; gap: 5px; font-weight: 600; border-radius: 2px; font-size: 11px;
    transition: all 0.1s ease;
  }
  .b:hover { background: var(--bg-hover); border-color: #55667e; color: #fff; }
  .b:active { transform: translateY(1px); }
  .b.on { background: #0e8a16; border-color: var(--c-green); color: #fff; font-weight: 700; box-shadow: 0 0 6px rgba(0,230,118,0.35); }
  .b.live { background: #d92418; border-color: #ff5247; color: #fff; font-weight: 700; box-shadow: 0 0 6px rgba(255,59,48,0.4); }
  .b.na, .b:disabled { color: var(--text-dim); background: #161a20; border-color: #232a35; cursor: default; }

  svg { width: 13px; height: 13px; fill: currentColor; flex: none; }

  /* ==========================================================================
     BARRA SUPERIOR (TOP HEADER ESTILO VMIX)
     ========================================================================== */
  .top-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px; background: #141921; border-bottom: 1px solid var(--border-subtle);
    gap: 4px; z-index: 10;
  }
  .brand-group {
    display: flex; align-items: center; gap: 6px; padding-right: 8px;
    border-right: 1px solid var(--border-subtle); margin-right: 4px;
  }
  .brand-group .logo { font-size: 12.5px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
  .brand-group .logo b { color: var(--c-green); }
  .brand-group .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-green); box-shadow: 0 0 8px var(--c-green); }
  .preset-badge {
    font-size: 10px; font-weight: 700; color: #ffbf47; background: #261f0e;
    padding: 2px 6px; border-radius: 2px; border: 1px solid #574116; font-family: Consolas, monospace;
  }

  .nav-group { display: flex; align-items: center; gap: 3px; }
  .nav-btn {
    height: 24px; padding: 0 7px; font-size: 10.5px; font-weight: 700; gap: 4px;
    background: #1a222c; border: 1px solid var(--border-subtle); color: #bcc7d6;
    border-radius: 2px; display: inline-flex; align-items: center; transition: all 0.1s;
  }
  .nav-btn:hover { background: #24303f; border-color: var(--border-strong); color: #fff; }
  .nav-btn.active { background: #13391d; border-color: #2e8243; color: #8ef5ab; }
  .nav-btn.accent { background: #132438; border-color: #1f5075; color: #76c7ff; }

  .top-right-group { display: flex; align-items: center; gap: 8px; }
  .aux-selector-bar {
    display: inline-flex; align-items: center; gap: 3px; padding: 0 6px;
    border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle);
  }
  .aux-label { font-size: 9.5px; font-weight: 800; color: var(--text-muted); }
  .aux-select {
    height: 20px; font-size: 10px; font-weight: 700; background: #10141a;
    border: 1px solid var(--border-strong); color: var(--c-green); border-radius: 2px;
    padding: 0 4px; outline: none; cursor: pointer;
  }

  /* ==========================================================================
     ÁREA CENTRAL: TILES DE ENTRADAS + MIXER DE ÁUDIO
     ========================================================================== */
  .mid { display: flex; min-height: 0; background: #0b0e12; }
  .tiles {
    flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start;
    gap: 6px; padding: 6px 8px; overflow-y: auto; min-width: 0;
  }

  /* Tiles das Entradas */
  .tile {
    width: 176px; background: var(--bg-panel); border: 1px solid var(--border-subtle);
    border-radius: 3px; box-shadow: 0 3px 8px rgba(0,0,0,0.5); overflow: hidden;
    display: flex; flex-direction: column; transition: border-color 0.12s;
  }
  .tile.is-out { border-color: var(--c-green); box-shadow: 0 0 10px rgba(0,230,118,0.4); }
  .tile.is-pv { border-color: var(--c-orange); box-shadow: 0 0 10px rgba(247,147,30,0.4); }

  .tt { height: 22px; display: flex; align-items: center; color: #fff; overflow: hidden; background: #252e3b; font-size: 11px; }
  .tt .n { width: 26px; height: 100%; display: grid; place-items: center; font-weight: 800; flex: none; background: #1c232d; border-right: 1px solid rgba(0,0,0,0.3); font-size: 11px; }
  .tt .nm { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-weight: 700; }
  .tt .tag { width: 11px; height: 11px; margin-right: 4px; border: 1px solid rgba(0,0,0,0.5); flex: none; cursor: pointer; border-radius: 2px; }
  .tt.pv { background: linear-gradient(180deg, #f7931e, #d47600); color: #000; }
  .tt.pv .n { background: #b86200; color: #fff; }
  .tt.out { background: linear-gradient(180deg, #109115, #0a660e); color: #fff; }
  .tt.out .n { background: #07470a; }

  .th { height: 98px; background: #000; display: block; width: 100%; position: relative; }
  .th img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile.is-pv .th { outline: 2px solid var(--c-orange); outline-offset: -2px; }
  .tile.is-out .th { outline: 2px solid var(--c-green); outline-offset: -2px; }

  .r { display: flex; background: #1c222a; border-top: 1px solid var(--border-subtle); }
  .r button {
    flex: 1; height: 21px; font-size: 10px; font-weight: 600; color: #b2bcc9;
    border-right: 1px solid var(--border-subtle); white-space: nowrap; display: grid;
    place-items: center; background: #202732;
  }
  .r button:last-child { border-right: 0; }
  .r button:hover { background: #2e3745; color: #fff; }
  .r button.on { background: #0e8a16; color: #fff; font-weight: 800; }
  .r button.na { color: var(--text-dim); cursor: default; background: #181d24; }
  .r button.na:hover { background: #181d24; color: var(--text-dim); }

  /* Linha dos 8 Canais de Overlays nos Tiles */
  .ov-bar { display: flex; background: #14181f; border-top: 1px solid #232b35; }
  .ov-bar button {
    flex: 1; height: 17px; font-size: 9px; font-weight: 800; color: #7a889b;
    border-right: 1px solid #232b35; background: #192028; text-align: center;
  }
  .ov-bar button:last-child { border-right: 0; }
  .ov-bar button:hover { background: #252f3b; color: #fff; }
  .ov-bar button.on { background: #d97a00; color: #fff; box-shadow: inset 0 0 4px #000; }

  /* Audio Mixer Lateral */
  .mixer {
    flex: none; display: none; gap: 6px; padding: 6px 8px; background: #12161d;
    border-left: 1px solid var(--border-subtle); overflow-x: auto; max-width: 48vw; min-width: 175px;
  }
  .mixer.on { display: flex; }
  .strip {
    width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: #1a202a; border: 1px solid var(--border-strong); padding: 5px 4px;
    min-height: 0; border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .strip .nm { width: 100%; text-align: center; font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .buses { display: flex; gap: 2px; width: 100%; justify-content: center; }
  .strip .buses button {
    width: 19px; height: 14px; font-size: 9px; font-weight: 800; background: #141920;
    border: 1px solid var(--border-strong); color: #8492a6; border-radius: 1px; cursor: pointer;
  }
  .strip .buses button.bus-m.on { background: #0e8a16; border-color: var(--c-green); color: #fff; }
  .strip .buses button.bus-a.on { background: #d97a00; border-color: var(--c-orange); color: #fff; }
  .strip .buses button.bus-b.on { background: #0288d1; border-color: var(--c-blue); color: #fff; }
  .strip .bd { flex: 1; min-height: 52px; display: flex; gap: 3px; align-items: stretch; margin: 2px 0; }
  .mt { width: 6px; background: #080a0d; position: relative; border-radius: 1px; }
  .mt::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, #2fd13a 0 70%, #e8d21d 70% 88%, #e0352b 88%);
    clip-path: inset(calc((1 - var(--l, 0)) * 100%) 0 0 0);
  }
  .fd { width: 18px; position: relative; touch-action: none; cursor: ns-resize; }
  .fd::before { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: #505966; }
  .fd i {
    position: absolute; left: 0; right: 0; height: 11px; bottom: calc(var(--v, 0) * (100% - 11px));
    background: linear-gradient(180deg, #d8e0ea, #9ea8b5); border: 1px solid #1c222a; border-radius: 2px;
  }
  .strip .db { font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; font-family: Consolas, monospace; }
  .strip.strip-master { background: #12241a; border: 1px solid #1c6633; border-top: 3px solid var(--c-green); }
  .strip.strip-phones { background: #132230; border: 1px solid #1f5075; border-top: 3px solid var(--c-blue); }

  /* ==========================================================================
     BARRA INFERIOR (CONTROLES DE CORTE & TRANSMISSÃO)
     ========================================================================== */
  .bot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; background: #161b22; gap: 8px; border-top: 1px solid var(--border-subtle);
  }
  .bot .g { display: flex; align-items: center; gap: 4px; }
  .bot .g-center { display: flex; align-items: center; gap: 4px; }
  .bot .tc { font: 700 12px Consolas, monospace; padding: 0 6px; color: #ffad99; background: #261715; border-radius: 2px; }
  .b.add-input {
    background: linear-gradient(180deg, #1d572a, #13391d); border-color: #2e8243;
    color: #8ef5ab; font-weight: 700; height: 26px; padding: 0 14px; font-size: 12px;
  }
  .b.add-input:hover { background: linear-gradient(180deg, #276b37, #1b4d27); border-color: var(--c-green); color: #fff; }

  /* Barra de Status */
  .stat {
    display: flex; align-items: center; gap: 14px; padding: 0 10px; background: #0c0f14;
    font-size: 11px; white-space: nowrap; overflow: hidden; border-top: 1px solid #19202a;
  }
  .stat .res { color: var(--c-green); font-weight: 700; font-family: Consolas, monospace; }
  .stat .sp { flex: 1; }
  .stat .clock { font-family: Consolas, monospace; color: #c0cad8; font-weight: 700; }

  /* ==========================================================================
     SISTEMA MODAL 100% CENTRALIZADO NO MEIO DA TELA
     ========================================================================== */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(8, 11, 16, 0.82);
    backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center;
    z-index: 99999;
  }
  .modal-backdrop.on { display: flex; }

  .modal-dialog {
    position: relative; background: #161c24; border: 1px solid var(--border-strong);
    border-radius: 6px; box-shadow: 0 25px 70px rgba(0,0,0,0.95);
    width: min(940px, 94vw); max-height: 88vh; display: flex; flex-direction: column;
    overflow: hidden; animation: popIn 0.15s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; background: #10141a; border-bottom: 1px solid var(--border-subtle);
  }
  .modal-header h3 {
    margin: 0; font-size: 13.5px; font-weight: 700; color: #fff; display: flex;
    align-items: center; gap: 8px;
  }
  .modal-header .close-btn {
    width: 26px; height: 26px; display: grid; place-items: center; font-size: 16px;
    color: var(--text-muted); border-radius: 3px;
  }
  .modal-header .close-btn:hover { background: #263140; color: #fff; }

  .modal-nav {
    display: flex; background: #131821; border-bottom: 1px solid var(--border-subtle);
    padding: 0 12px; gap: 4px; overflow-x: auto;
  }
  .modal-nav button {
    padding: 8px 12px; font-size: 11px; font-weight: 700; color: var(--text-muted);
    border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
  }
  .modal-nav button:hover { color: #fff; }
  .modal-nav button.active { color: var(--c-green); border-bottom-color: var(--c-green); }

  .modal-body {
    padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px;
  }
  .modal-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: #10141a; border-top: 1px solid var(--border-subtle);
  }

  /* Form Elements dentro dos Modais */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .form-control {
    height: 27px; background: #0f1318; border: 1px solid var(--border-strong);
    color: var(--text-primary); padding: 0 8px; border-radius: 3px; font-size: 11.5px;
  }
  .form-control:focus { border-color: var(--c-green); outline: none; }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row input[type="range"] { flex: 1; }
  .slider-row .val { width: 45px; text-align: right; font-family: Consolas, monospace; font-size: 11px; color: var(--c-green); }

  /* Toast Notification */
  .toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: #1c232d; border: 1px solid var(--border-strong); padding: 8px 16px;
    z-index: 100000; display: none; max-width: 80vw; border-radius: 3px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.7); font-weight: 600;
  }
  .toast.on { display: block; }
  .toast.err { border-color: #ef5a4f; color: #ffc4bf; background: #261618; }
</style>
</head>
<body>

  <!-- ========================================================================
       TOP HEADER (ESTILO VMIX COMPLETO)
       ======================================================================== -->
  <header class="top-header" id="top-header">
    <div class="brand-group">
      <span class="logo"><span class="dot"></span> Free<b>Mix</b></span>
      <span class="preset-badge" id="active-preset-badge">[ Producao_Estudio.fmx ]</span>
    </div>

    <!-- Menus de Produção vMix -->
    <div class="nav-group">
      <!-- Grupo Presets -->
      <button class="nav-btn" data-a="openmodal" data-m="presets" title="Gerenciar Presets (Novo, Abrir, Salvar)">
        <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg> Presets
      </button>

      <!-- Configurações Gerais -->
      <button class="nav-btn" data-a="openmodal" data-m="settings" title="Configurações Globais do FreeMix">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.5 7.5 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg> Configurações
      </button>

      <!-- Atalhos & MIDI -->
      <button class="nav-btn" data-a="openmodal" data-m="shortcuts" title="Mapeamento de Teclado e Controladores MIDI">
        <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg> Atalhos & MIDI
      </button>

      <!-- DataSources -->
      <button class="nav-btn" data-a="openmodal" data-m="datasources" title="Fontes de Dados (Excel, CSV, Google Sheets, JSON/API)">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H5v-2h4v2zm0-4H5v-2h4v2zm0-4H5V7h4v2zm10 8h-8v-2h8v2zm0-4h-8v-2h8v2zm0-4h-8V7h8v2z"/></svg> DataSources
      </button>

      <!-- 8 Canais de Overlays -->
      <button class="nav-btn accent" data-a="openmodal" data-m="overlays8" title="Gerenciar os 8 Canais de Overlays Independentes">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg> Overlays (8)
      </button>

      <!-- Replay Multi-Cam -->
      <button class="nav-btn accent" data-a="openmodal" data-m="replaymulticam" title="Central de Instant Replay Multi-Câmera (ISO)">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg> Replay Multi-Cam
      </button>

      <!-- Multi-WAN / Bonding -->
      <button class="nav-btn accent" data-a="openmodal" data-m="bonding" title="Transmissão Multi-WAN / Bonding LiveU (Ethernet + Wi-Fi + 5G)">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg> Bonding Failover
      </button>

      <!-- Central de Saídas -->
      <button class="nav-btn" data-a="openmodal" data-m="outputs" title="Central de Saídas (Fullscreen, NDI Alpha, SDI DeckLink, OMT)">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.11-.9-2-2-2zm0 14H3V5h18v12z"/></svg> Saídas
      </button>

      <!-- Gráficos / GCs -->
      <button class="nav-btn" data-a="openmodal" data-m="graphics" title="Central de Gráficos e Galeria de GCs">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg> Gráficos / GCs
      </button>

      <!-- Audio Matrix -->
      <button class="nav-btn" data-a="openmodal" data-m="audiomatrix" title="Matriz de Áudio (Master, Aux A Mix-Minus, Aux B Fones)">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg> Audio Matrix
      </button>
    </div>

    <!-- Controles Rápidos da Direita -->
    <div class="top-right-group">

        activeRow: 0,

      { id: "out-clean", name: "Clean Feed (Sem GCs / Overlays)", type: "projector", source: "CLEANFEED", dest: "-1", res: "1920x1080", fps: "60", audio: "Master", alpha: false, active: false, state: "stopped" },
      { id: "out-vcam", name: "Câmera Virtual (External 1)", type: "vcam", source: "PROGRAM", dest: "OBS Virtual Camera", res: "1920x1080", fps: "30", audio: "Vídeo", alpha: false, active: false, state: "stopped" },
      { id: "out-ndi", name: "NDI Master Broadcast", type: "ndi", source: "PROGRAM", dest: "FreeMix-PGM", res: "1920x1080", fps: "60", audio: "Master", alpha: true, active: false, state: "stopped" }
    ]),
    monitors: [],
    aux1Source: store.get("mesa.aux1", "PROGRAM"),
    aux2Source: store.get("mesa.aux2", "PREVIEW"),
    masterVol: store.get("mesa.masterVol", 1.0), masterMuted: false,
    phonesVol: store.get("mesa.phonesVol", 0.8), phonesMuted: false,
    activeInputProps: null, activeInputTab: "geral",

    showMonitors: store.get("mesa.showMonitors", true),
    tbarPos: 0,
    safeArea: true,
  
  };

  const thumbs = new Map();
  const blank = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 9"><rect width="16" height="9" fill="#000"/></svg>`);
  let toastTimer = 0;
  const toast = (msg, err) => {
    const t = $("toast"); t.textContent = msg; t.className = `toast on${err ? " err" : ""}`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = "toast"; }, err ? 5000 : 2400);
  };

  /* ---- Handshake SHA-256 ---- */
  function sha256js(bytes) {
    const K = [], H = [], isPrime = (n) => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
    for (let n = 2; K.length < 64; n++) if (isPrime(n)) { if (H.length < 8) H.push((Math.sqrt(n) * 2 ** 32) >>> 0); K.push((Math.cbrt(n) * 2 ** 32) >>> 0); }
    const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6, m = new Uint8Array(total), dv = new DataView(m.buffer), w = new Uint32Array(64);
    m.set(bytes); m[len] = 0x80; dv.setUint32(total - 4, len * 8); dv.setUint32(total - 8, Math.floor(len / 2 ** 29));
    const rot = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < total; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) { const a = w[i - 15], b = w[i - 2]; w[i] = (w[i - 16] + (rot(a, 7) ^ rot(a, 18) ^ (a >>> 3)) + w[i - 7] + (rot(b, 17) ^ rot(b, 19) ^ (b >>> 10))) >>> 0; }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0, t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
    }
    const out = new Uint8Array(32); H.forEach((v, i) => new DataView(out.buffer).setUint32(i * 4, v)); return out;
  }
  const sha = async (text) => {
    const data = new TextEncoder().encode(text);
    const hash = crypto.subtle ? new Uint8Array(await crypto.subtle.digest("SHA-256", data)) : sha256js(data);
    return btoa(String.fromCharCode(...hash));
  };

  /* ---- obs-websocket 5.x ---- */
  const SUBS = 1 | 4 | 8 | 16 | 64 | 128 | 1024 | 65536;
  let ws = null, seq = 0;
  const pending = new Map();
  const req = (type, data) => new Promise((res, rej) => {
    if (!st.on) return rej(new Error("Sem conexão com o motor"));
    const id = String(++seq);
    pending.set(id, { res, rej, type });
    ws.send(JSON.stringify({ op: 6, d: { requestType: type, requestId: id, requestData: data } }));
  });
  const tryReq = (type, data) => req(type, data).catch(() => null);

  function connect() {
    const mine = ws = new WebSocket(LOCAL.url || "ws://127.0.0.1:4455");
    mine.onmessage = async (ev) => {
      const m = JSON.parse(ev.data);
      if (m.op === 0) {
        const d = { rpcVersion: 1, eventSubscriptions: SUBS }, a = m.d.authentication;
        if (a) d.authentication = await sha((await sha((LOCAL.password || "") + a.salt)) + a.challenge);
        mine.send(JSON.stringify({ op: 1, d }));
      } else if (m.op === 2) {
        st.on = true; st.why = ""; syncAll().catch((e) => toast(e.message, true));
      } else if (m.op === 5) {
        if (m.d.eventType === "InputVolumeMeters") onMeters(m.d.eventData.inputs);
        else onEvent(m.d.eventType, m.d.eventData || {});
      } else if (m.op === 7) {
        const p = pending.get(m.d.requestId); if (!p) return;
        pending.delete(m.d.requestId);
        m.d.requestStatus.result ? p.res(m.d.responseData || {}) : p.rej(new Error(m.d.requestStatus.comment || `${p.type} falhou`));
      }
    };
    mine.onclose = () => {
      if (ws !== mine) return;
      for (const p of pending.values()) p.rej(new Error("Conexão encerrada")); pending.clear();
      st.on = false; st.why = "reconectando...";
      renderAll(); setTimeout(connect, 2000);
    };
  }

  const setScenes = (list) => { st.scenes = list.slice().sort((a, b) => b.sceneIndex - a.sceneIndex).map((s) => s.sceneName); };
  async function syncScenes() {
    const r = await req("GetSceneList");
    setScenes(r.scenes); st.program = r.currentProgramSceneName || ""; st.preview = r.currentPreviewSceneName || "";
    renderTiles(); renderHeaderAux();
  }
  async function syncAudio() {
    const { inputs } = await req("GetInputList");
    const next = new Map();
    for (const i of inputs) {
      const v = await tryReq("GetInputVolume", { inputName: i.inputName }); if (!v) continue;
      const m = await tryReq("GetInputMute", { inputName: i.inputName });
      const tr = (await tryReq("GetInputAudioTracks", { inputName: i.inputName }))?.inputAudioTracks || { "1": true, "2": false, "3": false };
      next.set(i.inputName, { mul: v.inputVolumeMul, db: v.inputVolumeDb, muted: !!m?.inputMuted, tracks: tr });
    }
    st.audio = next; renderMixer();
  }
  async function syncAll() {
    const [studio, tr, rec, stream, vcam, video, kinds] = await Promise.all([
      req("GetStudioModeEnabled"), req("GetSceneTransitionList"), tryReq("GetRecordStatus"),
      tryReq("GetStreamStatus"), tryReq("GetVirtualCamStatus"), req("GetVideoSettings"), req("GetInputKindList")
    ]);
    st.studio = studio.studioModeEnabled;
    st.transitions = tr.transitions.map((t) => ({ name: t.transitionName, kind: t.transitionKind }));
    st.cur = tr.currentSceneTransitionName;
    st.rec = !!rec?.outputActive; st.stream = !!stream?.outputActive; st.vcam = !!vcam?.outputActive;
    st.video = video; st.kinds = kinds.inputKinds;
    await syncScenes(); await syncAudio();
    renderAll();
  }

  function onEvent(type, d) {
    if (type === "CurrentProgramSceneChanged") { st.program = d.sceneName; renderTiles(); renderBot(); }
    else if (type === "CurrentPreviewSceneChanged") { st.preview = d.sceneName; renderTiles(); }
    else if (type === "SceneListChanged") { setScenes(d.scenes); renderTiles(); renderHeaderAux(); }
    else if (type === "RecordStateChanged") { st.rec = d.outputActive; renderBot(); }
    else if (type === "StreamStateChanged") { st.stream = d.outputActive; renderBot(); }
    else if (type === "InputVolumeChanged") {
      const a = st.audio.get(d.inputName);
      if (a) { a.mul = d.inputVolumeMul; a.db = d.inputVolumeDb; paintFader(d.inputName); }
    }
    else if (type === "InputMuteStateChanged") {
      const a = st.audio.get(d.inputName);
      if (a) { a.muted = d.inputMuted; renderMixer(); }
    }
  }

  function onMeters(inputs) {
    for (const i of inputs) {
      const el = document.querySelector(`.strip[data-n="${CSS.escape(i.inputName)}"]`); if (!el) continue;
      const peak = (ch) => { const mul = ch?.[1] ?? 0; return mul > 0 ? clamp((20 * Math.log10(mul) + 60) / 60, 0, 1) : 0; };
      const l = peak(i.inputLevelsMul[0]), r = i.inputLevelsMul[1] ? peak(i.inputLevelsMul[1]) : l, bars = el.querySelectorAll(".mt");
      if (bars.length >= 2) { bars[0].style.setProperty("--l", l.toFixed(3)); bars[1].style.setProperty("--l", r.toFixed(3)); }
    }
  }

  /* ---- Screenshots das Miniaturas ---- */
  const shown = () => st.scenes.filter((n) => st.filter < 0 || st.tags[n] === st.filter);
  async function thumbLoop() {
    let turn = 0;
    for (;;) {
      const names = st.on && !document.hidden ? shown() : [];
      if (!names.length) { await sleep(500); continue; }
      const hot = [st.program, st.preview].filter((n) => names.includes(n)), cold = names.filter((n) => !hot.includes(n));
      const batch = new Set(hot); for (let k = 0; k < 2 && cold.length; k++) batch.add(cold[turn++ % cold.length]);
      for (const name of batch) {
        const r = await tryReq("GetSourceScreenshot", { sourceName: name, imageFormat: "jpg", imageWidth: 256, imageCompressionQuality: 60 });
        if (!r) continue;
        thumbs.set(name, r.imageData);
        const img = document.querySelector(`img[data-t="${CSS.escape(name)}"]`); if (img) img.src = r.imageData;
      }
      await sleep(120);
    }
  }

  /* ---- Renderização dos Tiles ---- */
  function renderTiles() {
    const box = $("tiles");
    if (!st.on) {
      box.innerHTML = `<div style="padding:24px;color:var(--text-muted)">Conectando ao núcleo do FreeMix...</div>`;
      return;
    }
    box.innerHTML = shown().map((name) => {
      const isOut = name === st.program, isPv = st.studio && name === st.preview;
      const cls = isOut ? "out" : isPv ? "pv" : "";
      const tileCls = isOut ? " is-out" : isPv ? " is-pv" : "";
      const tag = st.tags[name], v = esc(name);

      // Botões dos 8 Overlays
      const ovButtons = [1,2,3,4,5,6,7,8].map((num) => {
        const ovData = st.overlays.find((o) => o.id === num);
        const activeThis = ovData?.active && ovData?.scene === name;
        return `<button class="${activeThis ? 'on' : ''}" data-a="toggleoverlay" data-ov="${num}" data-scene="${v}" title="Overlay ${num}: liga/desliga sobre o Programa">${num}</button>`;
      }).join("");

      return `<article class="tile${tileCls}" data-s="${v}">
        <div class="tt ${cls}">
          <span class="n">${st.scenes.indexOf(name) + 1}</span>
          <span class="nm" title="${esc(name)}">${esc(name)}</span>
          <i class="tag" style="background:${tag === undefined ? 'transparent' : COLORS[tag]}" data-a="tag" data-v="${esc(name)}"></i>
        </div>
        <button class="th" data-a="preview" data-v="${esc(name)}" title="Clique para enviar ao Preview (PVW)">
          <img data-t="${esc(name)}" src="${thumbs.get(name) || blank}" alt="">
        </button>
        <div class="r">
          <button data-a="cut" data-v="${esc(name)}" title="Corte seco imediato (CUT)">Cut</button>
          <button data-a="quick" data-v="${esc(name)}" title="Transição suave automática (FADE)">Fade</button>
          <button data-a="inputsettings" data-scene="${esc(name)}" title="Propriedades e Configurações desta Entrada">${GEAR} Config</button>
        </div>
        <div class="ov-bar">
          ${ovButtons}
        </div>
      </article>`;
    }).join("") || `<div style="padding:20px;color:var(--text-muted)">Nenhuma entrada criada. Clique em "+ Add Input" abaixo para adicionar.</div>`;
  }

  /* ---- Renderização do Áudio Mixer Lateral ---- */
  function renderMixer() {
    const box = $("mixer"); box.className = `mixer${st.mixer ? " on" : ""}`;
    if (!st.mixer) return;
    const strips = [...st.audio].map(([name, a]) => {
      const tr = a.tracks || { "1": true, "2": false, "3": false };
      return `<div class="strip" data-n="${esc(name)}">
        <div class="nm" title="${esc(name)}">${esc(name)}</div>
        <div class="buses">
          <button class="bus-m${tr['1'] ? " on" : ""}" data-a="bustoggle" data-n="${esc(name)}" data-track="1" title="Master (PGM)">M</button>
          <button class="bus-a${tr['2'] ? " on" : ""}" data-a="bustoggle" data-n="${esc(name)}" data-track="2" title="Aux A (Retorno Convidado Mix-Minus)">A</button>
          <button class="bus-b${tr['3'] ? " on" : ""}" data-a="bustoggle" data-n="${esc(name)}" data-track="3" title="Aux B (Fones / Direção)">B</button>
        </div>
        <div class="bd"><div class="mt"></div><div class="mt"></div><div class="fd" data-f="${esc(name)}"><i></i></div></div>
        <div class="db"></div>

  let dragging = null;
  const paintFader = (name) => {
    const el = document.querySelector(`.strip[data-n="${CSS.escape(name)}"]`);
    if (!el) return;
    const a = st.audio.get(name);
    if (!a) return;
    el.querySelector(".fd").style.setProperty("--v", Math.cbrt(clamp(a.mul, 0, 1)).toFixed(3));
    el.querySelector(".db").textContent = a.mul <= 0 ? "-inf" : `${(20 * Math.log10(a.mul)).toFixed(1)} dB`;
  };
  function bindFader(f) {
    const name = f.dataset.f;
    const move = (e) => {
      const r = f.getBoundingClientRect(), p = clamp(1 - (e.clientY - r.top - 5) / (r.height - 10), 0, 1);
      const val = p ** 3;
      if (name === "__MASTER__") { st.masterVol = val; store.set("mesa.masterVol", val); }
      else if (name === "__PHONES__") { st.phonesVol = val; store.set("mesa.phonesVol", val); }
      else {
        const a = st.audio.get(name);
        if (a) { a.mul = val; paintFader(name); req("SetInputVolume", { inputName: name, inputVolumeMul: a.mul }).catch(()=>{}); }
      }
    };
    f.onpointerdown = (e) => { dragging = name; f.setPointerCapture(e.pointerId); move(e); };
    f.onpointermove = (e) => { if (dragging === name) move(e); };
    f.onpointerup = f.onpointercancel = () => { dragging = null; };
  }

  const A = {
    openmodal: (d) => openModal(d.m, d.arg),
    closemodal: () => closeModal(),
    setaddtype: (d) => { st.addType = d.t; renderModalContent(); },
    confirmaddinput: () => {
      const name = $("add-input-name")?.value.trim() || "Entrada";
      const t = TYPES.find((x) => x.id === st.addType) || TYPES[0];
      req("CreateScene", { sceneName: name }).then(() => {
        closeModal();
        syncScenes();
        toast(`Entrada "${name}" criada com sucesso!`);
      }).catch((e) => toast(e.message, true));
    },
    inputsettings: (d) => { st.activeInputTab = "geral"; openModal("inputsettings", d.scene); },
    setinputtab: (d) => { st.activeInputTab = d.tab; renderModalContent(); },
    saveinputsettings: () => { closeModal(); toast("Ajustes da entrada salvos!"); },
    setsettingstab: (d) => { st.activeSettingsTab = d.stab; renderModalContent(); },
    runcheckupdates: () => {
      toast("Consultando releases oficiais no GitHub...");
      setTimeout(() => {
        toast("Todos os complementos obrigatórios estão atualizados!");
      }, 1000);
    },

    // Comutação
    preview: (d) => {
      if (st.studio) req("SetCurrentPreviewScene", { sceneName: d.v }).catch(()=>{});
      else req("SetCurrentProgramScene", { sceneName: d.v }).catch(()=>{});
    },
    cut: (d) => req("SetCurrentProgramScene", { sceneName: d.v }).catch(()=>{}),
    quick: (d) => {
      if (!st.studio) req("SetCurrentProgramScene", { sceneName: d.v }).catch(()=>{});
      else {
        req("SetCurrentPreviewScene", { sceneName: d.v }).then(() => req("TriggerStudioModeTransition")).catch(()=>{});
      }
    },
    studio: () => req("SetStudioModeEnabled", { studioModeEnabled: !st.studio }).catch(()=>{}),
    
    togglemonitors: () => {
      st.showMonitors = !st.showMonitors;
      store.set("mesa.showMonitors", st.showMonitors);
      renderMonitors();
    },
    cutprogram: () => {
      if (st.studio) req("TriggerStudioModeTransition").catch(()=>{});
      else req("SetCurrentProgramScene", { sceneName: st.preview }).catch(()=>{});
    },
    transfade: (d) => {
      req("TriggerStudioModeTransition").catch(()=>{});
      toast("Transição FADE (" + (d.dur || 500) + "ms) executada");
    },
    transzoom: (d) => {
      req("TriggerStudioModeTransition").catch(()=>{});
      toast("Transição ZOOM executada");
    },
    transwipe: (d) => {
      req("TriggerStudioModeTransition").catch(()=>{});
      toast("Transição WIPE executada");
    },
    transstinger: (d) => {
      req("TriggerStudioModeTransition").catch(()=>{});
      toast("Transição STINGER executada");
    },
    togglesafearea: () => {
      st.safeArea = !st.safeArea;
      const el = $("pv-safe-area");
      if (el) el.className = st.safeArea ? "safe-area-overlay" : "safe-area-overlay off";
      toast(st.safeArea ? "Safe Area Guias Ativadas" : "Safe Area Desativada");
    },
    lastpreset: () => {
      toast("Último Preset 'Producao_Estudio.fmx' recarregado!");
    },
  
    ftb: () => { st.ftb = !st.ftb; toast(st.ftb ? "FTB (Black) ATIVADO" : "FTB DESATIVADO"); renderBot(); },

    // Overlays 1 a 8
    toggleoverlay: (d) => {
      const num = +d.ov;
      const ov = st.overlays.find((o) => o.id === num);
      if (ov) {
        ov.active = !ov.active;
        ov.scene = d.scene || ov.scene || st.scenes[0] || "";
        store.set("freemix.overlays8", st.overlays);
        renderTiles();
        if (st.pop === "overlays8") renderModalContent();
        toast(`Overlay ${num}: ${ov.active ? 'LIGADO NO AR' : 'DESLIGADO'}`);
      }
    },
    setoverlaychannelscene: (d) => {
      const num = +d.ov;
      const ov = st.overlays.find((o) => o.id === num);
      if (ov) {
        ov.scene = d.target?.value || "";
        store.set("freemix.overlays8", st.overlays);
      }
    },
    clearalloverlays: () => {
      for (const ov of st.overlays) ov.active = false;
      store.set("freemix.overlays8", st.overlays);
      renderTiles();
      if (st.pop === "overlays8") renderModalContent();
      toast("Todos os 8 Overlays foram desligados.");
    },

    // Áudio
    bustoggle: (d) => {
      const name = d.n, trackNum = String(d.track);
      const a = st.audio.get(name);
      if (!a) return;
      const cur = a.tracks || { "1": true, "2": false, "3": false };
      const next = !cur[trackNum];
      a.tracks = { ...cur, [trackNum]: next };
      renderMixer();
      req("SetInputAudioTracks", { inputName: name, inputAudioTracks: a.tracks }).catch(()=>{});
    },
    mute: (d) => req("ToggleInputMute", { inputName: d.v }).catch(()=>{}),
    mastermute: () => { st.masterMuted = !st.masterMuted; renderMixer(); },
    phonesmute: () => { st.phonesMuted = !st.phonesMuted; renderMixer(); },
    toggleaudiomixer: () => { st.mixer = !st.mixer; store.set("mesa.mixer", st.mixer); renderMixer(); },

    // Replay
    playreplayangle: (d) => toast(`Reproduzindo lance da ${d.angle} em 50% de velocidade`),
    markin: () => toast("Ponto MARK IN gravado"),
    markout: () => toast("Ponto MARK OUT gravado"),
    grabinstant: (d) => toast(`Lance instantâneo dos últimos ${d.sec}s capturado!`),
    replayspeed: (d) => { st.rpSpeed = +d.spd; renderModalContent(); toast(`Velocidade de Replay ajustada para ${d.spd}%`); },
    revertlive: () => toast("Comutado para o sinal Ao Vivo (LIVE)"),

    // DataSources
    selectdatarow: (d) => { st.dataSources[0].activeRow = +d.row; renderModalContent(); },
    syncdataonair: () => {
      const r = st.dataSources[0].rows[st.dataSources[0].activeRow];
      toast(`Dados de "${r.Nome}" publicados nos GCs no ar!`);
    },
    prevrow: () => {
      st.dataSources[0].activeRow = Math.max(0, st.dataSources[0].activeRow - 1);
      renderModalContent();
    },
    nextrow: () => {
      st.dataSources[0].activeRow = Math.min(st.dataSources[0].rows.length - 1, st.dataSources[0].activeRow + 1);
      renderModalContent();
    },

    // Presets
    newpreset: () => { closeModal(); toast("Novo Preset limpo iniciado!"); },
    savepreset: () => { closeModal(); toast("Preset salvo com sucesso!"); },
    savepresetas: () => { closeModal(); toast("Preset salvo como nova cópia!"); },

    // Saídas & Gravação
    record: () => req("ToggleRecord").catch(()=>{}),
    stream: () => req("ToggleStream").catch(()=>{}),
    topfullscreen: () => toast("Saída Fullscreen enviada ao monitor externo"),
    topmultiview: () => toast("Mosaico Multiview ativado"),
    toggleoutput: (d) => {
      const o = st.outputs.find((x) => x.id === d.id);
      if (o) {
        o.active = !o.active;
        store.set("freemix.outputs", st.outputs);
        renderModalContent();
        toast(`${o.name}: ${o.active ? 'INICIADA' : 'PARADA'}`);
      }
    },

    // GCs
    gcpreview: () => toast("Prévia do GC carregada"),
    gconair: () => toast("GC colocado no ar com animação de entrada!"),
    clearallgcs: () => toast("Todos os gráficos foram retirados do ar.")
  };

  /* ---- Event Listeners ---- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-a]");
    if (!t) return;
    A[t.dataset.a]?.(t.dataset);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });

  
  function renderMonitors() {
    const sec = $("monitors-section");
    const btn = $("btn-toggle-monitors");
    if (!sec) return;
    if (!st.showMonitors) {
      sec.className = "monitors-section hidden";
      if (btn) btn.textContent = "📺 Monitores: OFF";
      return;
    }
    sec.className = "monitors-section";
    if (btn) btn.textContent = "📺 Monitores: ON";

    // Atualiza Preview
    const pvTitle = $("pv-source-title");
    if (pvTitle) pvTitle.textContent = st.preview || "Nenhuma";
    const pvThumb = $("pv-thumb");
    if (pvThumb && thumbs.has(st.preview)) pvThumb.src = thumbs.get(st.preview);

    // Atualiza Program
    const pgmTitle = $("pgm-source-title");
    if (pgmTitle) pgmTitle.textContent = st.program || "Nenhuma";
    const pgmThumb = $("pgm-thumb");
    if (pgmThumb && thumbs.has(st.program)) pgmThumb.src = thumbs.get(st.program);

    // T-Bar
    const h = $("tbar-handle");
    const pct = $("tbar-pct");
    if (h && pct) {
      h.style.bottom = st.tbarPos + "%";
      pct.textContent = st.tbarPos + "%";
    }

    // Timecode
    const now = new Date();
    const tc = $("pgm-timecode");
    if (tc) {
      tc.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}:00`;
    }
  }
  
  function renderAll() {
    renderMonitors();
    renderTiles(); renderMixer(); renderBot(); renderStat(); renderHeaderAux();
  }

  // Loop de relógio e telemetria
  setInterval(renderStat, 1000);

  // Inicialização
  renderAll();
  connect();
  thumbLoop();
</script>
</body>
</html>
