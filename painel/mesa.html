<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mesa</title>
<style>
  /* FreeMix Pro - Interface de Controle Broadcast estilo vMix */
  :root {
    --bg: #1e2328; --bar: #0a0f14; --btn: #293038; --btn-h: #404b56; --bd: #607081; --band: #1e2328; --row: #1e2328; --sep: #3e4854;
    --tx: #e6ebf2; --mut: #96a1b0; --dim: #5e6878;
    --org: #f7931e; --org2: #d97a00; --grn: #006400; --grn2: #006400; --blu: #293038; --blu2: #293038; --red: #ff0000;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--tx); font: 12px/1.2 "Segoe UI", -apple-system, Tahoma, Arial, sans-serif; user-select: none;
    display: grid; grid-template-rows: 64px 24px minmax(0, 1fr) 34px 22px; overflow: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input, select { font: inherit; }
  .b { height: 25px; padding: 0 11px; background: var(--btn); border: 1px solid var(--bd); color: var(--tx); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; border-radius: 2px; }
  .b:hover { background: var(--btn-h); border-color: #55667e; color: #fff; }
  .b.na, .b:disabled { color: var(--dim); background: #1a1f26; border-color: #2b3340; cursor: default; }
  .b.live { background: var(--red); border-color: #ff5247; color: #fff; font-weight: 700; }
  .b.on { background: var(--grn); border-color: #26c934; color: #fff; font-weight: 700; }
  svg { width: 13px; height: 13px; fill: currentColor; flex: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: #0c0f14; } ::-webkit-scrollbar-corner { background: #0c0f14; }
  ::-webkit-scrollbar-thumb { background: #2f3847; border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: #445166; }

  /* media controls row under preview/output - vMix 29 Broadcast Style */
  .media-row {
    display: grid; grid-template-columns: minmax(0,1fr) 150px minmax(0,1fr);
    background: var(--bg); border: 0; height: 64px;
    gap: 0; padding: 0 5px; box-sizing: border-box;
  }
  .media-bar {
    display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
    position: relative; overflow: hidden;
  }
  .media-bar.pv { grid-column: 1; padding: 0 0 4px; }
  .media-bar.pgm { grid-column: 3; padding: 0 0 4px; }
  .vmix-btn[hidden] { display: none; }
  .mb-list { color: #c3c9d2; text-shadow: none; white-space: pre; }
  /* The media row took 44 px from the panel: mixer strips are a little shorter so two rows still fit. */
  #mixer .strip, #mixer .sec, #mixer .busoff { height: 160px; }
  .media-bar.disabled { visibility: hidden; pointer-events: none; }

  /* 1. Time display row: 00:00:03 / 00:00:10 / 00:00:07 */
  .media-time-row {
    display: flex; justify-content: center; align-items: center; gap: 4px;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-size: 18px; font-weight: 700;
    color: var(--red); line-height: 22px;
  }
  .media-bar.disabled .media-time-row { color: #5a1818; text-shadow: none; }
  .media-time-row .sep { color: inherit; margin: 0 3px; font-weight: 400; }

  /* 2. Control row: Fader track + Reiniciar + Pause/Play */
  .media-ctrl-row {
    display: flex; align-items: center; gap: 6px; height: 34px;
  }
  .vmix-track-wrap {
    flex: 1; position: relative; height: 34px; margin: 0 12px; display: flex; align-items: center; cursor: pointer;
  }
  .vmix-track {
    width: 100%; height: 3px; background: #404b56; border: 0;
    border-radius: 0; box-shadow: none; position: relative;
  }
  .vmix-progress {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: #3e4c60; border-radius: 1px;
  }
  .vmix-thumb {
    position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
    width: 11px; height: 22px;
    background: #404b56;
    border: 1px solid #fff; border-radius: 0;
    box-shadow: none;
    cursor: ew-resize; display: flex; align-items: center; justify-content: center;
  }
  .vmix-thumb::after {
    content: ""; width: 2px; height: 10px; background: #444f5e;
    border-right: 1px solid rgba(255,255,255,0.4);
  }
  .vmix-btn {
    height: 34px; font-size: 11px; font-weight: 600; color: #d0d7e2;
    background: linear-gradient(180deg, #374150 0%, #252c37 100%);
    border: 1px solid #4a576a; border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    white-space: nowrap; user-select: none;
  }
  .vmix-btn:hover {
    background: linear-gradient(180deg, #445163 0%, #2c3542 100%); color: #fff; border-color: #5d6d84;
  }
  .vmix-btn:active {
    background: #1c222b; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .vmix-btn.restart { padding: 0 8px; font-size: 10.5px; }
  .vmix-btn.pp { width: 40px; font-size: 16px; }

  /* category tabs & brand */
  .tabs { display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--band); border-bottom: 1px solid #161a22; }
  .fm-brand { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 12px; color: #fff; padding-right: 8px; margin-right: 4px; border-right: 1px solid #364254; }
  .fm-brand b { color: #00b4d8; }
  .fm-brand .dot { width: 6px; height: 6px; border-radius: 50%; background: #00e676; display: inline-block; box-shadow: 0 0 6px #00e676; }
  .tabs .c { width: 22px; height: 18px; border: 1px solid rgba(0, 0, 0, .4); border-radius: 2px; }
  .tabs .c.all { width: auto; padding: 0 10px; background: var(--btn); font-weight: 700; font-size: 11px; }
  .tabs .c.on { outline: 1.5px solid #fff; outline-offset: -1px; }
  .tabs .sp { flex: 1; }
  .tabs .mx { height: 20px; padding: 0 10px; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 11px; background: #1c232d; border: 1px solid var(--bd); border-radius: 2px; color: var(--tx); }
  .tabs .mx:hover { background: var(--btn-h); }
  .tabs .mx.on { background: #26432b; border-color: #3ea853; color: #7cf795; }

  /* inputs + audio mixer */
  .mid { display: flex; min-height: 0; background: #11141a; }
  .tiles { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 6px 8px; overflow: auto; min-width: 0; }
  .tile { width: 172px; background: #161b22; border: 1px solid #2b3340; border-radius: 3px; box-shadow: 0 3px 8px rgba(0,0,0,0.45); overflow: hidden; display: flex; flex-direction: column; }
  .tile.is-out { border-color: var(--grn); box-shadow: 0 0 8px rgba(14, 138, 22, 0.4); }
  .tile.is-pv { border-color: var(--org); box-shadow: 0 0 8px rgba(247, 147, 30, 0.4); }
  .tt { height: 22px; display: flex; align-items: center; color: #fff; overflow: hidden; background: var(--blu); font-size: 11px; }
  .tt .n { width: 26px; height: 100%; display: grid; place-items: center; font-weight: 700; flex: none; background: var(--blu2); border-right: 1px solid rgba(0,0,0,0.3); font-size: 11px; }
  .tt .nm { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-weight: 700; }
  .tt .tag { width: 11px; height: 11px; margin-right: 4px; border: 1px solid rgba(0, 0, 0, .5); flex: none; cursor: pointer; border-radius: 2px; }
  .tt .iso, .pop .iso { background: var(--red); color: #fff; font-size: 9px; font-weight: 800; padding: 1px 4px; margin-right: 4px; flex: none; border-radius: 2px; }
  .pop label.chk { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; color: var(--tx); } .pop label.chk input { height: auto; }
  .bot .arrow { width: 18px; padding: 0; border-left: 0; font-size: 9px; }
  .tt .tag.none { border-color: transparent; } .tile:hover .tag.none { border: 1px dashed rgba(255, 255, 255, .45); }
  .tt.pv { background: linear-gradient(180deg, #f7931e, #d47600); color: #000; } .tt.pv .n { background: #b86200; color: #fff; }
  .tt.out { background: linear-gradient(180deg, #109115, #0a660e); } .tt.out .n { background: #07470a; }
  .th { height: 97px; background: #000; display: block; width: 100%; position: relative; }
  .th img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile.is-pv .th { outline: 2px solid #f7931e; outline-offset: -2px; }
  .tile.is-out .th { outline: 2px solid #00e676; outline-offset: -2px; }
  .r { display: flex; background: var(--row); border-top: 1px solid var(--sep); }
  .r button { flex: 1; height: 20px; font-size: 10.5px; font-weight: 600; color: #b2bcc9; border-right: 1px solid var(--sep); white-space: nowrap; display: grid; place-items: center; background: #222832; }
  .r button:last-child { border-right: 0; } .r button:hover { background: #323b49; color: #fff; }
  .r button.na { color: #505966; cursor: default; background: #1c2129; } .r button.na:hover { background: #1c2129; color: #505966; }
  .r button.on { background: var(--grn); color: #fff; font-weight: 700; }
  .r .w2 { flex: 2; }
  .empty { color: var(--mut); padding: 18px; line-height: 1.5; max-width: 520px; }
  .mixer { flex: none; display: none; gap: 4px; padding: 6px 8px; background: #181d24; border-left: 1px solid var(--sep); overflow-x: auto; max-width: 46vw; min-width: 160px; }
  .mixer.on { display: flex; }
  .mixer .none { color: var(--mut); width: 190px; padding: 8px; line-height: 1.5; }
  .strip { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--row); border: 1px solid var(--sep); padding: 5px 3px; min-height: 0; border-radius: 2px; }
  .strip .nm { width: 100%; text-align: center; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e1e7ef; }
  .strip .bd { flex: 1; min-height: 52px; display: flex; gap: 3px; align-items: stretch; }
  .mt { width: 6px; background: #080a0d; position: relative; border-radius: 1px; }
  .mt::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, #2fd13a 0 70%, #e8d21d 70% 88%, #e0352b 88%); clip-path: inset(calc((1 - var(--l, 0)) * 100%) 0 0 0); }
  .fd { width: 18px; position: relative; touch-action: none; cursor: ns-resize; }
  .fd::before { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: #505966; }
  .fd i { position: absolute; left: 0; right: 0; height: 10px; bottom: calc(var(--v, 0) * (100% - 10px)); background: linear-gradient(180deg, #d8e0ea, #9ea8b5); border: 1px solid #1c222a; border-radius: 1px; }
  .strip .db { font-size: 10px; color: var(--mut); font-variant-numeric: tabular-nums; font-family: Consolas, monospace; }
  .strip .bt button { width: 26px; height: 17px; font-size: 10px; font-weight: 800; background: var(--btn); border: 1px solid var(--bd); display: grid; place-items: center; border-radius: 2px; }
  .strip .bt .muted { background: var(--red); border-color: #ef5a4f; color: #fff; }

  /* bottom bar + status */
  .bot { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; background: var(--bar); gap: 6px; border-top: 1px solid #28313d; }
  .bot .g { display: flex; align-items: center; gap: 3px; } .bot .gear { width: 26px; padding: 0; }
  .bot .tc { font: 700 12px Consolas, monospace; padding: 0 6px; color: #ffad99; background: #261715; border-radius: 2px; margin-left: 2px; }
  .b.add-input { background: linear-gradient(180deg, #1d4e28, #13391d); border-color: #2e8243; color: #8ef5ab; font-weight: 700; height: 26px; padding: 0 14px; font-size: 12px; }
  .b.add-input:hover { background: linear-gradient(180deg, #276b37, #1b4d27); border-color: #3ec75e; color: #fff; }
  .stat { display: flex; align-items: center; gap: 14px; padding: 0 10px; background: #0e1116; font-size: 11px; white-space: nowrap; overflow: hidden; border-top: 1px solid #1b2029; }
  .stat b { font-weight: 700; } .stat .res { color: #00e676; font-weight: 700; font-family: Consolas, monospace; } .stat .sp { flex: 1; }
  .stat .ok { color: #00e676; } .stat .bad { color: #ff5252; }
  .stat .clock { font-family: Consolas, monospace; color: #c0cad8; font-weight: 600; }

  /* popovers */
  /* popovers */
  .pop { position: fixed; z-index: 20; left: 8px; bottom: 58px; background: #1c222b; border: 1px solid #4a576b; padding: 10px; width: 330px; box-shadow: 0 14px 40px rgba(0, 0, 0, .75); display: none; border-radius: 4px; }
  .pop.on { display: block; } .pop.right { left: auto; right: 8px; }
  .pop h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: #fff; }
  .pop label { display: grid; gap: 3px; margin-bottom: 8px; color: var(--mut); }
  .pop input, .pop select { height: 25px; background: #10141a; border: 1px solid var(--bd); color: var(--tx); padding: 0 6px; border-radius: 2px; }
  .pop .row { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .pop p { margin: 0 0 8px; color: var(--mut); line-height: 1.45; }
  .pop table { border-collapse: collapse; width: 100%; } .pop td { padding: 4px 6px 4px 0; border-top: 1px solid var(--sep); }
  .pop .sw { width: 22px; height: 22px; border: 1px solid rgba(0, 0, 0, .5); border-radius: 2px; } .pop .sw.x { background: var(--btn); display: grid; place-items: center; }

  /* Modais Panorâmicos Amplos e Espaçosos */
  .pop.wide { position: fixed; top: 50% !important; left: 50% !important; bottom: auto !important; right: auto !important; transform: translate(-50%, -50%) !important; width: min(1060px, calc(100vw - 32px)); max-height: calc(100vh - 44px); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; padding: 0; box-shadow: 0 24px 70px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 255, 255, .08); }
  .pop.xwide { width: min(1440px, calc(100vw - 32px)) !important; }
  .pop-header { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; background: #11151c; border-bottom: 1px solid #2d3847; flex: none; }
  .pop-header h3 { margin: 0; font-size: 13px; font-weight: 700; color: #eaf0f8; display: flex; align-items: center; gap: 8px; }
  .pop-header-actions { display: flex; align-items: center; gap: 6px; }
  .pop-detach-btn { height: 22px !important; font-size: 11px !important; padding: 0 8px !important; background: #222b37 !important; border: 1px solid #3d4c60 !important; color: #cbd6e2 !important; font-weight: 600; cursor: pointer; border-radius: 3px; display: inline-flex; align-items: center; gap: 4px; }
  .pop-detach-btn:hover { background: #323f52 !important; border-color: #556a88 !important; color: #fff !important; }
  .pop-close-btn { width: 22px; height: 22px; font-size: 13px; font-weight: 700; color: #8d9baa; background: transparent; border: 1px solid transparent; border-radius: 3px; display: grid; place-items: center; cursor: pointer; line-height: 1; }
  .pop-close-btn:hover { background: #d92418; border-color: #ff5247; color: #fff; }
  .pop-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; }

  /* Modo Pop-up / Janela Flutuante Independente (para segundo monitor) */
  body.popup-mode { display: flex !important; flex-direction: column !important; height: 100vh !important; width: 100vw !important; background: var(--bg) !important; overflow: hidden !important; }
  body.popup-mode #media-row, body.popup-mode #mixer, body.popup-mode #tiles-wrap, body.popup-mode #tiles, body.popup-mode .bot, body.popup-mode .stat { display: none !important; }
  body.popup-mode .pop { position: static !important; transform: none !important; width: 100% !important; max-width: 100% !important; height: 100% !important; max-height: 100% !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; display: flex !important; flex-direction: column !important; padding: 0 !important; }
  body.popup-mode .pop-detach-btn { display: none !important; }
  body.popup-mode .pop-body { flex: 1 !important; overflow-y: auto !important; padding: 14px 18px !important; }

  .add { display: grid; grid-template-columns: 175px 1fr; gap: 0; height: min(270px, calc(100vh - 140px)); }
  .add .types { overflow-y: auto; background: #10141a; border: 0; }
  .add .types button { display: block; width: 100%; text-align: left; padding: 5px 10px; border-bottom: 0; font-size: 11.5px; font-weight: 600; color: #bcc7d6; }
  .add .types button:hover { background: #1c222c; color: #fff; }
  .add .types button.on { background: #0e8a16; color: #fff; font-weight: 700; }
  .add .types button::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border: 2px solid #e3e7ec; vertical-align: -1px; }
  .add .types button.off::before { border-color: var(--dim); }
  .add .form { display: flex; flex-direction: column; background: #eef1f5; color: #15191e; padding: 10px 12px; overflow-y: auto; }
  .add .form p { order: -1; margin: -10px -12px 10px; padding: 9px 12px; background: #10141a; color: #e3e7ec; font-size: 11.5px; }
  .add .form label { color: #333a42; font-weight: 600; font-size: 11.5px; margin-bottom: 6px; }
  .add .form input { background: #fff; color: #15191e; border: 1px solid #8f98a3; height: 25px; padding: 0 6px; border-radius: 2px; }
  .pop.wide .row.end { margin: 0; padding: 8px 12px; background: var(--bar); gap: 8px; border-top: 1px solid #2a3340; flex: none; }
  .pop.wide .row.end .b { min-width: 96px; height: 26px; font-weight: 700; }
  .r .ic { flex: none; width: 22px; } .r .ic svg { width: 12px; height: 12px; }
  .tri { width: 0; height: 0; border-left: 7px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
  .toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #20262e; border: 1px solid #5a636e; padding: 7px 12px; z-index: 30; display: none; max-width: 80vw; border-radius: 3px; box-shadow: 0 4px 14px rgba(0,0,0,0.6); }
  .toast.on { display: block; } .toast.err { border-color: #ef5a4f; color: #ffc4bf; }
  .tt.pv { background: linear-gradient(180deg, #12a31a, #0a7a10); color: #fff; } .tt.pv .n { background: #07590b; color: #fff; }
  .tt.out { background: linear-gradient(180deg, #e0281c, #b3160d); color: #fff; } .tt.out .n { background: #8a0f08; color: #fff; }
  .tile.is-pv { border-color: #12a31a; } .tile.is-out { border-color: #e0281c; }
  .tt .x { width: 20px; height: 100%; flex: none; font-weight: 700; color: inherit; opacity: .8; } .tt .x:hover { opacity: 1; background: rgba(0, 0, 0, .3); }
  .bot .cg { width: 26px; padding: 0; margin-left: 10px; border-right: 0; } .bot .cg svg { width: 13px; height: 13px; }
  .pop fieldset { border: 1px solid var(--bd); margin: 0 0 8px; padding: 8px; } .pop legend { background: #0b6bbf; color: #fff; padding: 2px 10px; font-weight: 600; }
  .pop fieldset input, .pop fieldset select { width: 100%; }
  .outs { max-height: calc(100vh - 118px); overflow: auto; background: var(--bg); padding: 6px 10px; }
  .outs table { width: 100%; border-collapse: collapse; } .outs th { text-align: left; color: var(--mut); font-size: 10px; text-transform: uppercase; padding: 4px 8px 6px 0; }
  .outs td { padding: 4px 8px 4px 0; border-top: 1px solid var(--sep); vertical-align: middle; white-space: nowrap; } .outs td small { display: block; color: var(--mut); font-size: 9px; }
  .outs td { max-width: 330px; overflow: hidden; text-overflow: ellipsis; }
  .outs select { height: 22px; background: #12161b; border: 1px solid var(--bd); color: var(--tx); max-width: 200px; }
  .outs .b { height: 22px; } .outs .cg { margin-left: 4px; width: 24px; padding: 0; }
  .bdg { display: inline-block; padding: 1px 7px; font-size: 10px; font-weight: 700; border: 1px solid var(--bd); color: var(--mut); } .bdg.on { background: var(--red); border-color: #ef5a4f; color: #fff; } .bdg.na { border-style: dashed; }
  body.basic .tile .r, body.basic .mixer { display: none !important; }
  .bot { background: #0d1013; justify-content: space-between; padding: 0 4px; gap: 0; }
  .bot .b { height: 24px; background: #2a3540; border: 1px solid #4b5967; color: #f2f5f8; font-weight: 700; font-size: 11px; padding: 0 12px; border-radius: 0; }
  .bot .b:hover { background: #364452; } .bot .b.live { background: var(--red); border-color: #ef5a4f; } .bot .b.on { background: var(--grn); border-color: #2fb02c; }
  .bot .b:disabled { color: #6b7480; background: #1b2229; border-color: #2c353e; }
  .bot .g.l { display: flex; align-items: center; gap: 0; } .bot .g.r { display: flex; align-items: center; gap: 3px; }
  .bot .pair { display: inline-flex; align-items: center; margin-left: 28px; } .bot .pair .cg { width: 38px; padding: 0; margin: 0 1px 0 0; border-right: 1px solid #4b5967; }
  .bot .dd { width: 16px; padding: 0; margin-left: -1px; font-size: 7px; } .bot .ib { width: 28px; padding: 0; } .bot .ib svg { width: 14px; height: 14px; }
  body.locked .tt .x { display: none; } body.list .th { display: none; } body.big .tile { width: 236px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .add .form select { background: #fff; color: #15191e; border: 1px solid #8f98a3; } .add .form input:disabled, .add .form select:disabled { background: #e3e5e8; color: #5a636e; }

      $("mb-" + side + "-cur").textContent = "00:00:00";
      $("mb-" + side + "-dur").textContent = "00:00:00";
      $("mb-" + side + "-rem").textContent = "00:00:00";
      $("mb-" + side + "-bar").style.width = "0%";
      $("mb-" + side + "-thumb").style.left = "0%";
      $("mb-" + side + "-play").textContent = "▶";
      s.name = ""; s.dur = 0; s.cur = 0;
      $("mb-" + side + "-prev").hidden = $("mb-" + side + "-next").hidden = true;
      $("mb-" + side + "-list").textContent = "";
      return;
    }

    s.name = media.name;
    // Previous / next only make sense for a list of files.
    const isList = /playlist/.test(media.kind) || media.kind === "vlc_source";
    $("mb-" + side + "-prev").hidden = $("mb-" + side + "-next").hidden = !isList;

    const stMedia = await tryReq("GetMediaInputStatus", { inputName: media.name });
    if (!stMedia) { bar.classList.add('disabled'); s.name = ''; return; }
    bar.classList.remove("disabled");

    s.dur = stMedia.mediaDuration || 0;
    s.state = stMedia.mediaState || "";
    const isPlaying = s.state === "OBS_MEDIA_STATE_PLAYING";
    $("mb-" + side + "-play").textContent = isPlaying ? "⏸" : "▶";

    if (!s.dragging) {
      s.cur = stMedia.mediaCursor || 0;
      const rem = Math.max(0, s.dur - s.cur);
      const pct = s.dur > 0 ? Math.min(100, Math.max(0, (s.cur / s.dur) * 100)) : 0;

      $("mb-" + side + "-cur").textContent = fmtMs(s.cur);
      $("mb-" + side + "-dur").textContent = fmtMs(s.dur);
      $("mb-" + side + "-rem").textContent = fmtMs(rem);
      $("mb-" + side + "-bar").style.width = pct + "%";
      $("mb-" + side + "-thumb").style.left = pct + "%";
      if (isList) listTimes(side, media.name, rem).catch(() => {}); else $("mb-" + side + "-list").textContent = "";
    }
  }

  // Playlist times. The engine only knows the file that is playing, so the length of each file of the list is read
  // by the panel itself (metadata only) and kept by path.
  const plDur = new Map(), plInfo = { pv: { at: 0 }, pgm: { at: 0 } };
  const probeDuration = (path) => new Promise((resolve) => {
    const v = document.createElement("video"); let done = false;
    const end = (d) => { if (done) return; done = true; v.removeAttribute("src"); v.load(); resolve(d); };
    v.preload = "metadata"; v.muted = true; v.onloadedmetadata = () => end(isFinite(v.duration) ? v.duration * 1000 : null); v.onerror = () => end(null);
    setTimeout(() => end(null), 6000);
    v.src = "file:///" + String(path).replace(/\\/g, "/").split("/").map(encodeURIComponent).join("/").replace(/^([A-Za-z])%3A/, "$1:");
  });
  async function listTimes(side, name, remMs) {
    const info = plInfo[side], el = $("mb-" + side + "-list");
    if (Date.now() - info.at > 1500) {
      info.at = Date.now();
      const s = (await tryReq("GetInputSettings", { inputName: name }))?.inputSettings, files = (s?.playlist || []).filter((x) => !x.hidden).map((x) => x.value);
      for (const f of files) if (!plDur.has(f)) { plDur.set(f, undefined); probeDuration(f).then((d) => plDur.set(f, d)); }
      info.files = files; info.index = s?.current_media_index ?? 0;
    }
    const files = info.files || [], d = files.map((f) => plDur.get(f)), known = d.length > 0 && d.every((x) => typeof x === "number");
    const total = known ? d.reduce((a, b) => a + b, 0) : null, after = known ? d.slice(info.index + 1).reduce((a, b) => a + b, 0) : null;
    el.textContent = files.length ? ` · lista ${Math.min(info.index + 1, files.length)}/${files.length} · total ${total == null ? "--:--" : fmtMs(total)} · falta ${after == null ? "--:--" : fmtMs(remMs + after)}` : "";
  }

  // Interatividade do Fader Broadcast do vMix
  ["pv", "pgm"].forEach((side) => {
    const wrap = $("mb-" + side + "-wrap");
    if (!wrap) return;

    const setPositionFromEvent = (e) => {
      const s = mbState[side];
      if (!s.dur) return;
      const rect = wrap.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const curMs = Math.round(pct * s.dur);

      $("mb-" + side + "-bar").style.width = (pct * 100) + "%";
      $("mb-" + side + "-thumb").style.left = (pct * 100) + "%";
      $("mb-" + side + "-cur").textContent = fmtMs(curMs);
      $("mb-" + side + "-rem").textContent = fmtMs(Math.max(0, s.dur - curMs));
      return curMs;
    };

    const startDrag = (e) => {
      e.preventDefault();
      mbState[side].dragging = true;
      const s = mbState[side];
      setPositionFromEvent(e);

      const onMove = (me) => {
        if (mbState[side].dragging) setPositionFromEvent(me);
      };
      const onEnd = (ue) => {
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup", onEnd);
        window.removeEventListener("touchmove", onMove);
        window.removeEventListener("touchend", onEnd);
        const finalMs = setPositionFromEvent(ue);
        if (s.name && finalMs != null) {
          run(req("SetMediaInputCursor", { inputName: s.name, mediaCursor: finalMs }));
        }
        setTimeout(() => { mbState[side].dragging = false; }, 250);
      };

      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onEnd);
      window.addEventListener("touchmove", onMove);
      window.addEventListener("touchend", onEnd);
    };

    wrap.addEventListener("mousedown", startDrag);
    wrap.addEventListener("touchstart", startDrag);
  });

  // Ações dos botões vMix
  A.mb_restart = (d) => {
    const s = mbState[d.side];
    if (s.name) run(req("TriggerMediaInputAction", { inputName: s.name, mediaAction: "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART" }));
  };
  A.mb_play = (d) => {
    const s = mbState[d.side];
    if (!s.name) return;
    const act = s.state === "OBS_MEDIA_STATE_PLAYING" ? "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PAUSE" : "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PLAY";
    run(req("TriggerMediaInputAction", { inputName: s.name, mediaAction: act }));
  };

  const mbStep = (d, action) => { const s = mbState[d.side]; if (s.name) run(req("TriggerMediaInputAction", { inputName: s.name, mediaAction: "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_" + action })); };
  A.mb_prev = (d) => mbStep(d, "PREVIOUS");
  A.mb_next = (d) => mbStep(d, "NEXT");

  async function mediaLoop() {
    while (true) {
      if (st.on) {
        await alignMediaBars().catch(() => {});
        await syncMediaBar("pv", st.preview).catch(() => {});
        await syncMediaBar("pgm", st.program).catch(() => {});
      } else for (const side of ['pv','pgm']) $('mb-' + side).classList.add('disabled');
      await sleep(200);
    }
  }
  async function productionMetadataLoop(){while(true){if(st.on)try{const response=await fetch(new URL('/api/json',replayUrl).href,{signal:AbortSignal.timeout(2000)});if(response.ok){const data=await response.json();window.FreeMixProductionState=data;if(data.connected){const tags=Object.fromEntries((data.inputs||[]).map(i=>[i.name,i.tags||[]]));const tagsChanged=JSON.stringify(tags)!==JSON.stringify(st.inputTags),tallyChanged=JSON.stringify(data.tally)!==JSON.stringify(st.recursiveTally);st.inputTags=tags;st.recursiveTally=data.tally;if(tagsChanged){renderTabs();scheduleMesaPaint('tiles');}else if(tallyChanged)scheduleMesaPaint('tally');}}}catch{}await sleep(1500);}}
  // BEGIN isolated visual integration: no command/request/state queue.
  const mesaPaintQueue = new Set();
  const mesaPaintFns = {tiles:renderTiles, tally:paintTileState, mixer:renderMixer, bot:renderBot};
  let mesaPaintFrame = null;
  function paintTileState() {
    const tiles = [...$('tiles').querySelectorAll('.tile[data-s]')], names = shown();
    const present = new Set(tiles.map(tile => tile.dataset.s));
    // Structural mismatch needs the normal renderer; never attach state to a stale card.
    if (!st.on || tiles.length !== names.length || names.some(name => !present.has(name))) return renderTiles();
    for (const tile of tiles) {
      const name = tile.dataset.s;
      const isOut = name === st.program || !!st.recursiveTally?.program?.includes(name);
      const isPv = !isOut && st.studio && (name === st.preview || !!st.recursiveTally?.preview?.includes(name));
      tile.classList.toggle('is-out', isOut); tile.classList.toggle('is-pv', !!isPv);
      const title = tile.querySelector('.tt');
      if (title) {
        title.classList.toggle('out', isOut); title.classList.toggle('pv', !!isPv);
        const close = title.querySelector('button[data-a="closeask"]');
        if (isOut) close?.remove();
        else if (!tile.classList.contains('min') && !close) {
          const button = document.createElement('button'); button.className = 'x';
          button.setAttribute('data-a', 'closeask'); button.setAttribute('data-v', name); button.title = 'Fechar esta entrada'; button.textContent = '×'; title.append(button);
        }
      }
      const audio = tile.querySelector('[data-role="input-audio"]');
      if (audio) {
        const aud = sceneAudio(name); audio.classList.toggle('on', aud.some(input => !st.audio.get(input)?.muted));
      }
    }
  }
  function clearMesaPaints() {
    mesaPaintQueue.clear();
    if (mesaPaintFrame !== null) cancelAnimationFrame(mesaPaintFrame);
    mesaPaintFrame = null;
  }
  function flushMesaPaints() {
    if (mesaDisposed) { clearMesaPaints(); return; }
    if (mesaPaintFrame !== null) cancelAnimationFrame(mesaPaintFrame);
    mesaPaintFrame = null;
    let names = [...mesaPaintQueue]; mesaPaintQueue.clear();
    if (names.includes('tiles')) names = names.filter(name => name !== 'tally');
    for (const name of names) try { mesaPaintFns[name](); } catch { console.warn('FreeMix: não foi possível atualizar um controle visual.'); }
  }
  function scheduleMesaPaint(name) {
    if (mesaDisposed) return;
    mesaPaintQueue.add(name);
    // Hidden windows retain only renderer names and repaint once when visible.
    if (!document.hidden && mesaPaintFrame === null) mesaPaintFrame = requestAnimationFrame(() => { mesaPaintFrame = null; flushMesaPaints(); });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (mesaPaintFrame !== null) cancelAnimationFrame(mesaPaintFrame); mesaPaintFrame = null; }
    else if (mesaPaintQueue.size) scheduleMesaPaint([...mesaPaintQueue][0]);
  });
  window.addEventListener('pagehide', () => {
    mesaDisposed = true; clearMesaPaints();
    rejectMesaRequests('Painel encerrado. Resultado incerto: confira o estado antes de repetir comandos.');
    try { ws?.close(1000); } catch {}
  });
  // END isolated visual integration
  renderAll(); connect(); thumbLoop(); slowLoop(); mediaLoop(); productionMetadataLoop(); initMidi(); initSplitter();

  // Suporte a janela destacada independente (pop-up para segundo monitor)
  const qParams = new URLSearchParams(location.search);
  const qPop = qParams.get("pop");
  const qArg = qParams.get("arg");
  if (qPop === 'replay') {
    // Native menu entries still use mesa.html?pop=replay. Open the full console,
    // whose camera, audio and retention controls are absent from the compact dock.
    location.replace(replayUrl.replace(/\/api\/replay$/, '/replay'));
  } else if (qPop) {
    document.body.classList.add("popup-mode");
    if(['replay','list','mixer'].includes(qPop))document.body.classList.add('side-popup');
    if (qPop === "replay") {
      document.title = "FreeMix Studio - Instant Replay Controller";
      st.sideTab = "replay";
    } else if (qPop === "list") {
      document.title = "FreeMix Studio - List Editor";
      st.sideTab = "list";
    } else if (qPop === "mixer") {
      document.title = "FreeMix Studio - Audio Mixer";
      st.sideTab = "mixer";
    } else {
      document.title = "FreeMix Studio - " + qPop.toUpperCase();
    }
    const popupStarted = Date.now();
    const pendingPanel = $("pop");
    pendingPanel.className = "pop on";
    const showPendingPanel = () => {
      if (st.on) return;
      pendingPanel.innerHTML = `<h3>${esc(document.title)}</h3><div class="pop-body"><p>${Date.now() - popupStarted > 10000 ? 'O motor ainda não respondeu. Verifique se o FreeMix está aberto e conectado.' : 'Conectando ao motor do FreeMix…'}</p><p>${esc(st.why || '')}</p><button class="b" type="button" id="retry-panel">Tentar novamente</button></div>`;
      $("retry-panel").onclick = () => location.reload();
    };
    showPendingPanel();
    const checkInitialPop = setInterval(() => {
      if (st.on) {
        clearInterval(checkInitialPop);
        if(['replay','list','mixer'].includes(qPop)){st.mixer=true;renderTabs();renderSideDock();}
        else openPop(qPop, qArg || undefined);
      } else showPendingPanel();
    }, 200);
  }
</script>
<script src="remoto/midi-feedback.js"></script>
<script src="remoto/atalhos-engine.js"></script>
<script src="remoto/input-menu-ui.js"></script>
