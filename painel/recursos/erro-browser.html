<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FreeMix · janela indisponível</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#1c242b;color:#edf4f7;font:15px/1.5 "Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,680px);background:#10181f;border:1px solid #3a4954;border-top:4px solid #00b43a;padding:clamp(20px,5vw,40px)}
    .brand{font-weight:700;font-size:24px;color:#fff;margin:0 0 24px}.brand span{color:#00dc58}
    h1{font-size:20px;margin:0 0 12px}.description,.hint{color:#bac7d1}.details{background:#1c242b;padding:16px;overflow-wrap:anywhere}
    #retry-link{display:inline-block;margin-top:12px;padding:9px 16px;background:#007e29;border:1px solid #00b43a;color:white;text-decoration:none;font-weight:600}
    #retry-link:hover,#retry-link:focus-visible{background:#00a136;outline:2px solid #e3ffed;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="brand">Free<span>Mix</span></p>
    <h1>Error.Title</h1>
    <p class="description">Error.Description</p>
    <p class="details"><span id="error-string">%%ERROR_CODE%%</span><br>URL: <span id="error-url">%%ERROR_URL%%</span></p>
    <p class="hint">Se esta for uma janela do FreeMix, abra o programa pelo atalho instalado e aguarde o serviço de controle iniciar.</p>
    <a href="%%ERROR_URL%%" id="retry-link">Error.Retry</a>
  </main>
</body>
</html>
