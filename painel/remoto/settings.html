<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeMix · Configurações</title><link rel="stylesheet" href="controle.css"><style>.settings{display:grid;grid-template-columns:210px 1fr;gap:24px}nav{display:grid;align-content:start;gap:5px}nav button{text-align:left}nav button.selected{background:#315d86}label{display:grid;gap:8px;margin:12px 0}input,select{max-width:500px;width:100%}.settings section{min-height:430px}.foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:650px){.settings{grid-template-columns:1fr}nav{grid-template-columns:repeat(2,1fr)}}.native-check{display:flex;align-items:center;gap:8px}.native-check input{width:auto}a{color:#87c7ff}.field-help{display:block;max-width:650px;font-size:12px;color:#495660;margin:-4px 0 14px}#description{line-height:1.45}.settings-editor{width:100%;height:70vh;min-height:450px;border:0}button[hidden]{display:none}</style><link rel="stylesheet" href="studio-dialog.css"></head><body data-page="settings"><header><a href="/">FreeMix</a><h1 id="window-title">Configurações gerais</h1><button id="native-open" title="Abrir editor completo do FreeMix">Editor completo</button><span id="connection">Conectando…</span></header><main><p id="message" role="status"></p><div class="settings"><aside class="settings-nav"><input id="settings-search" type="search" placeholder="Buscar opções…" aria-label="Buscar configurações"><nav id="categories"></nav></aside><section><h2 id="title">Lendo configurações…</h2><p id="description"></p><div class="row"><button id="defaults">Padrões desta categoria</button><button id="export">Exportar categoria</button><button id="import">Importar categoria</button><input id="import-file" type="file" accept=".json,application/json" hidden></div><p id="transfer-note">Vídeo, Gravação e Transmissão: arquivo local sem credenciais. Importar e Padrões preparam campos; somente Aplicar altera o perfil.</p><div id="content"></div></section></div><footer class="foot"><button id="cancel">Cancelar alterações</button><button id="apply">Aplicar</button><button id="ok">OK</button></footer></main><script src="controle.js"></script><script src="settings-encoders.js"></script><script src="settings-help.js"></script><script src="settings.js"></script></body></html>
