<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chamada de Vídeo</title>
<link rel="stylesheet" href="vmix-dialogo.css">
</head>
<body data-page="calls" class="vd">
<div class="vd-window vd-with-status">
  <div class="vd-body">
    <div class="vd-row"><span></span>
      <div class="vd-nums" id="nums" role="tablist" aria-label="Chamada">
        <button data-n="0" role="tab">1</button><button data-n="1" role="tab">2</button><button data-n="2" role="tab">3</button><button data-n="3" role="tab">4</button><button data-n="4" role="tab">5</button><button data-n="5" role="tab">6</button><button data-n="6" role="tab">7</button><button data-n="7" role="tab">8</button>
      </div>
    </div>
    <div class="vd-row"><span>Nome</span><input id="name" type="text" maxlength="60" spellcheck="false" autocomplete="off">
      <button id="host" title="Cria uma entrada na mesa que recebe o vídeo e o áudio do convidado">Hospedar chamada</button></div>
    <div class="vd-row"><span>Senha</span><input id="password" type="text" class="vd-mono" readonly spellcheck="false">
      <div class="vd-inline" style="gap:6px"><button id="copy">Copiar Link</button><button id="reset" title="Troca a senha: o link antigo deixa de funcionar">Redefinir Senha</button></div></div>
    <div class="vd-row"><span></span><div class="vd-note vd-link" id="link"></div></div>
    <div class="vd-row"><span></span><span class="vd-title">Sinal de retorno(Para Convidado)</span><button id="apply" title="Envia ao programa o que você escolheu abaixo">Aplicar</button></div>
    <label class="vd-row"><span>Fonte de vídeo</span><select id="video"></select></label>
    <label class="vd-row"><span>Fonte de áudio</span><select id="audio"></select></label>
    <div class="vd-row" id="custom-row" hidden><span></span><div class="vd-checks" id="sources"></div></div>
    <div class="vd-row"><span></span><label class="vd-check"><input id="conference" type="checkbox"> Convidados ouvem uns aos outros</label></div>
    <div class="vd-row"><span>Talkback para</span><select id="talk-mode" class="vd-short"><option value="all">Todos os convidados</option><option value="selected">Somente os marcados</option></select></div>
    <div class="vd-row"><span></span><div class="vd-checks" id="targets"></div></div>
    <div class="vd-row"><span></span><div class="vd-note" id="talk-status"></div></div>
    <div class="vd-row"><span></span><label class="vd-check"><input id="show-advanced" type="checkbox"> Mostrar opções avançadas</label></div>
    <div class="vd-advanced" id="advanced" hidden>
      <div class="vd-row"><span>Nível do retorno</span>
        <div class="vd-inline"><label class="vd-check"><input id="gain" type="number" min="0" max="200" step="5" style="width:60px"> %</label>
          <button id="reconnect" title="Refaz a conexão do retorno deste convidado">Reconectar</button></div></div>
      <div class="vd-row"><span>Microfone do diretor</span><select id="mic"></select>
        <div class="vd-inline" style="gap:6px"><button id="mic-use">Usar</button><button id="mic-create" title="Cria um microfone privado com o dispositivo padrão do Windows">Criar</button></div></div>
      <div class="vd-row"><span></span><div class="vd-note" id="mic-status"></div></div>
      <div class="vd-row"><span>Rede dos retornos</span>
        <div class="vd-inline" style="gap:6px"><button id="ice-import" title="Arquivo TURN do kit do seu servidor">Importar TURN…</button><button id="ice-reset">Rede automática</button><span class="vd-note" id="ice-status"></span></div></div>
      <div class="vd-row"><span>Diagnóstico</span><div class="vd-note vd-mono" id="diag"></div></div>
      <div class="vd-row"><span></span><div class="vd-note" id="limit" style="white-space:normal"></div></div>
      <input id="ice-file" type="file" accept="application/json,.json" hidden>
    </div>
    <p id="msg" class="vd-msg" role="status"></p>
  </div>
  <div class="vd-status" id="status">
    <table><thead><tr><th>#</th><th>Chamada</th><th>Convidado vê</th><th>Convidado ouve</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
  <div class="vd-bar">
    <button id="returns">Preparar retornos</button>
    <button id="talk" aria-pressed="false">Segure para falar</button>
    <button id="manager" class="vd-on">Gerenciador de chamadas</button>
    <span class="vd-flex"></span>
    <button id="save-close">Salvar e Fechar</button>
  </div>
</div>
<span id="connection" hidden></span><p id="message" hidden></p>
<script src="controle.js"></script>
<script src="calls.js"></script>
</body>
</html>
