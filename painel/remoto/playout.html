<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeMix · Playout de VT e Listas</title><link rel="stylesheet" href="/controle.css"><link rel="stylesheet" href="/studio-dialog.css"><style>.queue-editor{display:grid;grid-template-columns:1fr 64px 1.2fr 48px;gap:8px}.queue-editor>label{display:flex;flex-direction:column;align-items:stretch;gap:10px;min-width:0}.queue-editor select{height:280px;width:100%;box-sizing:border-box}.queue-editor ol{width:100%;box-sizing:border-box}.queue-editor{margin:16px 0}.queue-editor small{margin-left:16px;color:#59616b}.queue-editor li.selected small{color:white}@media(max-width:720px){.queue-editor{grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr) 36px}}.queue-editor ol{height:280px;margin:0;padding:0;list-style:none;background:white;color:#111;overflow:auto;border:1px solid #a9afb5}.queue-editor li{padding:8px;cursor:pointer}.queue-editor li.selected{background:#006400;color:white}.queue-editor small{float:right}.queue-buttons{display:flex;flex-direction:column;justify-content:center;gap:6px}</style></head><body data-page="playout"><header><a href="/">FreeMix</a><h1>Playout de VT e Listas</h1><span id="connection">Conectando…</span></header><main><div id="message" role="status" aria-live="polite"></div><section><div class="row"><button id="queue-new">Nova playlist</button><button id="queue-delete">Excluir playlist</button><input id="queue-name" value="Playlist" aria-label="Nome da playlist"><select id="queue-list" aria-label="Playlist"></select><button id="queue-save">Salvar</button></div><div class="queue-editor"><label>Entradas disponíveis<select id="queue-available" size="12"></select></label><div class="queue-buttons"><button id="queue-add">&gt;</button><button id="queue-remove">&lt;</button></div><label>Playlist<ol id="queue-items"></ol></label><div class="queue-buttons"><button id="queue-up">▲</button><button id="queue-down">▼</button></div></div><div class="row"><label>Duração do item (segundos, 0 = duração do vídeo)<input id="queue-duration" type="number" min="0" max="86400" value="0"></label><label><input id="queue-loop" type="checkbox">Loop</label><label><input id="queue-auto" type="checkbox" checked>Auto-advance</label><label>Transição<select id="queue-transition"><option value="cut">Cut</option><option value="fade">Fade</option></select></label></div><p id="queue-total"></p><p id="queue-status"></p><div class="row"><button id="queue-start">Começar no selecionado</button><button id="queue-preload">Preparar no Preview</button><button id="queue-next">Próximo no ar</button><button id="queue-hold">Hold / continuar</button><button id="queue-stop">Parar playlist</button></div></section><details><summary>Controles de mídia da entrada</summary><section><label>Fonte de mídia<select id="media-select"></select></label><p id="media-state"></p><p class="big" id="time">--:--</p><label>Posição<input id="seek" type="range" min="0" max="0" value="0"></label><div class="row"><button data-media="PREVIOUS">Anterior</button><button data-media="PLAY">Reproduzir</button><button data-media="PAUSE">Pausar</button><button data-media="STOP">Parar</button><button data-media="RESTART">Reiniciar</button><button data-media="NEXT">Próximo</button></div></section><section class="row"><label>Velocidade (%)<select id="speed"><option>10</option><option>25</option><option>50</option><option>75</option><option>100</option><option>125</option><option>150</option><option>200</option></select></label><label><input type="checkbox" id="loop">Loop</label><label><input type="checkbox" id="autonext">Auto-Next</label></section><section><h2>Arquivos na fonte</h2><ol id="items"></ol><small>Os arquivos são os configurados na entrada da mesa. Próximo/anterior requer uma fonte de playlist; velocidade requer uma fonte de vídeo compatível.</small></section></details></main><script src="/controle.js"></script><script src="/fila.js"></script></body></html>
