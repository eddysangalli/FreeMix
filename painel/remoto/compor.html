<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeMix · Composições</title><link rel="stylesheet" href="controle.css"><style>.workspace{display:grid;grid-template-columns:300px 1fr;gap:20px}label{display:grid;gap:5px}select,input{width:100%}.slot{border:1px solid #445;padding:12px;margin-bottom:10px}.coords{display:flex;gap:5px}.coords input{width:100%}svg{width:100%;max-height:34vh;background:#101820}svg rect{fill:#29445b;stroke:#ffac36;stroke-width:3}svg text{fill:white;font:700 35px Segoe UI}@media(max-width:800px){.workspace{grid-template-columns:1fr}}</style><link rel="stylesheet" href="studio-dialog.css"><link rel="stylesheet" href="compor.css"></head><body data-page="compor"><header><a href="/">FreeMix</a><h1>Composições</h1><span id="connection">Conectando…</span></header><main><p id="error" role="alert" hidden></p><div class="workspace"><section><h2>Criar entrada composta</h2><form id="create"><label>Nome<input id="name" maxlength="60" value="Entrevista"></label><label>Layout<select id="layout"><option value="2box">2 pessoas</option><option value="3box">3 pessoas</option><option value="4box">4 pessoas</option><option value="vertical2box">Vertical · 2 pessoas</option><option value="verticalpip">Vertical · PiP</option><option value="pip">Picture in Picture</option><option value="slides">Apresentador + slides</option></select></label><label>Cor do fundo<input id="color" type="color" value="#101820"></label><div id="new-slots"></div><button class="on" type="submit">Criar entrada</button><p id="create-status" role="status" aria-live="polite"></p></form><p>Uma composição vira uma entrada normal na mesa. Os slots usam a identidade da entrada; trocar ordem ou nome não exige recriar o layout.</p></section><section><h2>Editar composição</h2><label>Entrada<select id="composition"></select></label><svg id="canvas" aria-label="Posições dos participantes"></svg><div id="slots"></div><div class="row"><button id="preview">Preparar no Preview</button><button id="undo">Desfazer posição</button></div><label>Categorias (separadas por vírgula)<input id="tags"></label><button id="save-tags">Salvar categorias</button><p id="status" role="status"></p></section></div></main><script src="controle.js"></script><script src="compor.js"></script><script src="compor-avancado.js"></script><script src="compor-galeria.js"></script></body></html>
