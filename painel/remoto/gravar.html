<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configuração de gravação</title>
<link rel="stylesheet" href="vmix-dialogo.css">
</head>
<body data-page="gravar" class="vd">
<div class="vd-window">
  <div class="vd-body">
    <div class="vd-row"><span></span>
      <div class="vd-nums vd-words" id="formats" role="tablist" aria-label="Formato de arquivo"></div>
    </div>
    <label class="vd-row"><span>Pasta de gravação</span><input id="directory" type="text" maxlength="500" spellcheck="false" autocomplete="off"></label>
    <div class="vd-row"><span>Codec</span>
      <div class="vd-inline"><select id="encoder" class="vd-short"></select>
        <label class="vd-check"><input id="hardware" type="checkbox"> Use Encoder da Placa de Vídeo(GPU)</label></div>
    </div>
    <label class="vd-row"><span>Qualidade</span><select id="quality">
      <option value="Stream">Igual à da transmissão</option>
      <option value="Small">Alta · arquivo médio</option>
      <option value="HQ">Muito alta · arquivo grande</option>
      <option value="Lossless">Sem perdas · arquivo enorme</option>
    </select></label>
    <div class="vd-row" id="tolerant-row"><span></span><label class="vd-check" title="Se o programa ou o computador cair no meio, o arquivo gravado até ali continua abrindo"><input id="tolerant" type="checkbox"> Modo Tolerante a falhas</label></div>
    <div class="vd-row"><span>Tamanho</span><span class="vd-note" id="size"></span></div>
    <p id="msg" class="vd-msg" role="status"></p>
  </div>
  <div class="vd-bar">
    <button id="advanced" title="Abre o editor completo de gravação">Avançado</button>
    <span class="vd-flex"></span>
    <button id="ok">OK</button>
    <button id="cancel">Cancelar</button>
  </div>
</div>
<span id="connection" hidden></span><p id="message" hidden></p>
<script src="controle.js"></script>
<script src="fechar-janela.js"></script>
<script src="gravar.js"></script>
</body>
</html>
