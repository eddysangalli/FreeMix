<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700, height=540, initial-scale=1.0">
  <title>FreeMix - Configuração de Gravação</title>
  <link rel="stylesheet" href="vmix-dialogo.css">
  <style>
    /* Estilos escopados para o Diálogo de Gravação R2 (Referência vMix) */
    html, body {
      margin: 0;
      padding: 0;
      width: 700px;
      height: 540px;
      background: #1e2328;
      color: #e0e6ed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      user-select: none;
      overflow: hidden;
      box-sizing: border-box;
    }

    .vrec-window {
      display: flex;
      flex-direction: column;
      width: 700px;
      height: 540px;
      box-sizing: border-box;
      background: #181d22;
      border: 1px solid #323b44;
    }

    /* Barra de Título */
    .vrec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: #14171b;
      border-bottom: 1px solid #2a313a;
      height: 42px;
      box-sizing: border-box;
    }
    .vrec-header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
      color: #ffffff;
    }
    .vrec-icon {
      width: 18px;
      height: 18px;
      background: #00aa13;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
    }
    .vrec-status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: #2a323d;
      color: #9cb1c9;
      border: 1px solid #3b4654;
    }
    .vrec-status-badge.active {
      background: #b31414;
      color: #ffffff;
      border-color: #e62222;
      animation: pulse-rec 1.6s infinite ease-in-out;
    }
    @keyframes pulse-rec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    /* Área Central Dividida */
    .vrec-body {
      display: flex;
      flex: 1;
      height: calc(540px - 42px - 54px);
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Barra Lateral de Formatos */
    .vrec-sidebar {
      width: 190px;
      background: #0f1216;
      border-right: 1px solid #28303a;
      display: flex;
      flex-direction: column;
      padding: 10px 0;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .vrec-sidebar-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6c7d93;
      padding: 4px 16px 8px 16px;
      font-weight: 700;
    }
    .vrec-format-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 9px 16px;
      background: transparent;
      border: none;
      border-left: 4px solid transparent;
      color: #b8c4d2;
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      box-sizing: border-box;
    }
    .vrec-format-btn:hover:not(:disabled) {
      background: #1b2128;
      color: #ffffff;
    }
    .vrec-format-btn.active {
      background: #1b7a1b;
      border-left-color: #38df38;
      color: #ffffff;
      font-weight: 700;
    }
    .vrec-format-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Painel Principal de Configuração */
    .vrec-main {
      flex: 1;
      background: #ffffff;
      color: #1a1e24;
      padding: 20px 24px;
      overflow-y: auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Alerta de Modo Avançado */
    .vrec-adv-banner {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.4;
      display: none;
    }
    .vrec-adv-banner.visible {
      display: block;
    }
    .vrec-adv-banner a {
      color: #533f03;
      font-weight: bold;
      text-decoration: underline;
    }

    /* Linhas do Formulário */
    .vrec-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .vrec-label {
      font-size: 12px;
      font-weight: 600;
      color: #2b313a;
    }
    .vrec-input {
      width: 100%;
      padding: 7px 10px;
      font-size: 12px;
      border: 1px solid #c0c6cf;
      border-radius: 3px;
      background: #fafbfc;
      color: #1a1e24;
      box-sizing: border-box;
      outline: none;
    }
    .vrec-input:focus:not(:disabled) {
      border-color: #1b7a1b;
      background: #ffffff;
    }
    .vrec-select {
      width: 100%;
      padding: 7px 10px;
      font-size: 12px;
      border: 1px solid #c0c6cf;
      border-radius: 3px;
      background: #fafbfc;
      color: #1a1e24;
      box-sizing: border-box;
      outline: none;
      cursor: pointer;
    }
    .vrec-select:focus:not(:disabled) {
      border-color: #1b7a1b;
    }
    .vrec-input:disabled, .vrec-select:disabled {
      background: #e9ecef;
      color: #6c757d;
      cursor: not-allowed;
    }

    /* Informações de Projeto (Readonly) */
    .vrec-info-box {
      background: #f1f4f8;
      border: 1px solid #dce2e8;
      border-radius: 4px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11px;
      color: #4b5563;
    }
    .vrec-info-item strong {
      color: #1f2937;
    }

    /* Mensagem de Feedback */
    .vrec-status-msg {
      font-size: 12px;
      min-height: 16px;
      font-weight: 500;
    }
    .vrec-status-msg.error {
      color: #c91414;
    }
    .vrec-status-msg.success {
      color: #007a14;
    }

    /* Rodapé */
    .vrec-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: #14171b;
      border-top: 1px solid #2a313a;
      height: 54px;
      box-sizing: border-box;
    }
    .vrec-footer-left {
      display: flex;
      gap: 10px;
    }
    .vrec-footer-right {
      display: flex;
      gap: 10px;
    }
    .vrec-btn {
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 3px;
      border: 1px solid #3c4654;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .vrec-btn-secondary {
      background: #252b33;
      color: #cbd5e1;
    }
    .vrec-btn-secondary:hover:not(:disabled) {
      background: #313944;
      color: #ffffff;
    }
    .vrec-btn-primary {
      background: #1b7a1b;
      color: #ffffff;
      border-color: #279427;
    }
    .vrec-btn-primary:hover:not(:disabled) {
      background: #219621;
    }
    .vrec-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="vrec-window">
    <!-- Topo -->
    <header class="vrec-header">
      <div class="vrec-header-title">
        <span class="vrec-icon">REC</span>
        <span>Configuração de Gravação</span>
      </div>
      <div id="rec-badge" class="vrec-status-badge">PARADO</div>
    </header>

    <!-- Corpo Dividido -->
    <div class="vrec-body">
      <!-- Barra Lateral de Formatos -->
      <nav class="vrec-sidebar" aria-label="Formatos de Gravação">
        <div class="vrec-sidebar-title">Formatos</div>
        <div id="format-list"></div>
      </nav>

      <!-- Painel Principal de Configurações -->
      <main class="vrec-main">
        <div id="adv-banner" class="vrec-adv-banner" role="alert">
          <strong>Perfil em Modo Avançado:</strong> Este perfil utiliza saída avançada personalizada do motor. Ajustes simplificados de gravação estão desativados para prevenir conflitos.
          <a href="/settings?category=recording&context=recording" id="link-advanced-banner">Abrir Editor Avançado Completo</a>.
        </div>

        <!-- Destino do Arquivo -->
        <div class="vrec-row">
          <label for="rec-directory" class="vrec-label">Pasta de Gravação</label>
          <input type="text" id="rec-directory" class="vrec-input" placeholder="Ex: C:\Gravações ou /home/user/recordings" maxlength="500" spellcheck="false">
        </div>

        <!-- Codificador de Vídeo -->
        <div class="vrec-row">
          <label for="rec-encoder" class="vrec-label">Codificador de Vídeo</label>
          <select id="rec-encoder" class="vrec-select">
            <option value="" disabled selected>Carregando codificadores…</option>
          </select>
        </div>

        <!-- Qualidade de Gravação -->
        <div class="vrec-row">
          <label for="rec-quality" class="vrec-label">Qualidade da Gravação</label>
          <select id="rec-quality" class="vrec-select">
            <option value="HQ">HQ (Alta Qualidade - Padrão)</option>
            <option value="Small">Small (Arquivo Menor / Taxa Reduzida)</option>
            <option value="Lossless">Lossless (Qualidade Sem Perdas / Arquivo Grande)</option>
            <option value="Stream">Stream (Mesma Qualidade da Transmissão)</option>
          </select>
        </div>

        <!-- Resumo Somente Leitura do Projeto -->
        <div class="vrec-info-box">
          <div class="vrec-info-item">Resolução do Projeto: <strong id="info-resolution">--</strong></div>
          <div class="vrec-info-item">Taxa de Quadros: <strong id="info-fps">--</strong></div>
        </div>

        <!-- Mensagem de Feedback / Status -->
        <div id="status-msg" class="vrec-status-msg" role="status"></div>
      </main>
    </div>

    <!-- Rodapé de Ações -->
    <footer class="vrec-footer">
      <div class="vrec-footer-left">
        <button type="button" id="btn-advanced" class="vrec-btn vrec-btn-secondary">Avançado…</button>
      </div>
      <div class="vrec-footer-right">
        <button type="button" id="btn-cancel" class="vrec-btn vrec-btn-secondary">Cancelar</button>
        <button type="button" id="btn-save" class="vrec-btn vrec-btn-primary">OK</button>
      </div>
    </footer>
  </div>

  <script src="controle.js"></script>
  <script src="gravar.js"></script>
</body>
</html>
