<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', -apple-system, sans-serif;
  }
  .breaking-container {
    position: absolute;
    bottom: 80px;
    left: 80px;
    right: 80px;
    display: flex;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    opacity: 0;
    transform: translateY(60px);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
  }
  .breaking-container.in {
    opacity: 1;
    transform: translateY(0);
  }
  .badge {
    background: #d50000;
    color: #ffffff;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    text-transform: uppercase;
    animation: pulse 1.2s infinite alternate;
  }
  @keyframes pulse {
    0% { background: #d50000; }
    100% { background: #ff1744; }
  }
  .content {
    background: #0f1724;
    color: #ffffff;
    font-size: 24px;
    font-weight: 600;
    padding: 16px 28px;
    flex: 1;
    display: flex;
    align-items: center;
    border-left: 4px solid #ffffff;
  }
</style>
</head>
<body>

<div id="box" class="breaking-container">
  <div class="badge" id="f-badge">URGENTE</div>
  <div class="content" id="f-text">Texto da manchete ou comunicado extraordinário ao vivo</div>
</div>

<script>
  function play(data) {
    if (data) update(data);
    document.getElementById("box").classList.add("in");
  }
  function stop() {
    document.getElementById("box").classList.remove("in");
  }
  function update(data) {
    if (data.titulo) document.getElementById("f-badge").textContent = data.titulo;
    if (data.texto) document.getElementById("f-text").textContent = data.texto;
  }
  window.GC = { play, stop, update };
</script>
<script src="../gc.js"></script>
</body>
</html>
