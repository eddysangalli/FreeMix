<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920,height=1080,initial-scale=1"><title>Synthetic shapes fixture</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file: http://127.0.0.1:* http://localhost:*; style-src 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*"><style>*{box-sizing:border-box;margin:0;padding:0}html,body,#gc-root{width:1920px;height:1080px;overflow:hidden;background:transparent}#gc-root{position:relative;transform-origin:top left;visibility:hidden}@keyframes ticker-horizontal{from{transform:translateX(1920px)}to{transform:translateX(-100%)}}@keyframes ticker-vertical{from{transform:translateY(1080px)}to{transform:translateY(-100%)}}</style></head><body><div id="gc-root"><div id="gt-0" class="gt-motion gt-layer" data-name="Direct" data-xml-path="/Composition[1]/Direct" style="position:absolute;left:0px;top:0px;width:1920px;height:1080px"><div class="gt-content " style="width:100%;height:100%;position:relative;opacity:1;transform:translate(0px,0px) rotate(0deg) scale(1,1);transform-origin:50% 50%"><div id="gt-1" class="gt-motion gt-object" data-name="Polygon" data-xml-path="/Composition[1]/Polygon[1]" style="position:absolute;left:24px;top:32px;width:120px;height:80px"><div class="gt-content " style="width:100%;height:100%;position:relative;opacity:0.7;transform:translate(4px,8px) rotate(28.64788975654116deg) scale(1.2,0.8);transform-origin:25% 50%;clip-path:inset(10% 9.999999999999998% 0% 0%)"><svg width="100%" height="100%" viewBox="0 0 120 80" style="overflow:visible"><g fill="rgba(0, 170, 68, 1)" stroke="rgba(255, 255, 255, 1)" stroke-width="2"><polygon points="0,0 120,0 60,80"/></g></svg></div></div><div id="gt-2" class="gt-motion gt-object" data-name="Path" data-xml-path="/Composition[1]/Path[1]" style="position:absolute;left:160px;top:48px;width:200px;height:100px"><div class="gt-content " style="width:100%;height:100%;position:relative;opacity:0.9;transform:translate(0px,0px) rotate(0deg) scale(1,1);transform-origin:50% 50%"><svg width="100%" height="100%" viewBox="0 0 200 100" style="overflow:visible"><g fill="rgba(255, 204, 0, 1)" stroke="transparent" stroke-width="0"><path d="M0,0 L200,0 L100,100 Z"/></g></svg></div></div></div></div></div><script>
const specs=[{"id":"gt-1","phase":"TransitionIn","from":{"opacity":0},"to":{"opacity":1,"transform":"none","clipPath":"inset(0 0 0 0)"},"duration":800,"delay":100,"origin":"left center","easing":"cubic-bezier(.55,.055,.675,.19)"},{"id":"gt-2","phase":"TransitionIn","from":{"opacity":0,"transform":"translateX(1920px)"},"to":{"opacity":1,"transform":"none","clipPath":"inset(0 0 0 0)"},"duration":700,"delay":0,"origin":"right center","easing":"cubic-bezier(.55,.055,.675,.19)"}],fields=[],assetMap={};let active=[],timeline={};
function animate(phase){for(const a of active)a.cancel();active=[];document.getElementById('gc-root').style.visibility='visible';for(const a of specs.filter(s=>s.phase===phase)){const el=document.getElementById(a.id);if(!el)continue;el.style.transformOrigin=a.origin;const frames=phase==='TransitionOut'?[a.to,a.from]:[a.from,a.to],animation=el.animate(frames,{duration:a.duration,delay:a.delay,easing:a.easing,fill:'both'});active.push(animation);}if(phase==='TransitionIn'&&Number.isFinite(timeline.animationStartedAt)&&timeline.animationStartedAt>0){const elapsed=Math.max(0,Date.now()-timeline.animationStartedAt);for(const a of active)a.currentTime=elapsed;}if(phase==='TransitionOut'){const end=Math.max(0,...specs.filter(a=>a.phase===phase).map(a=>a.duration+a.delay));Promise.all(active.map(a=>a.finished.catch(()=>null))).then(()=>{if(active.every(a=>a.playState==='finished'))document.getElementById('gc-root').style.visibility='hidden';});if(!active.length)document.getElementById('gc-root').style.visibility='hidden';}}
function update(data){if(!data||typeof data!=='object')return;for(const el of document.querySelectorAll('[data-field-name]')){const key=el.dataset.fieldName;if(!Object.hasOwn(data,key))continue;const val=String(data[key]??'');if(el.classList.contains('gt-qrcode')){if(window.FreeMixGtQr)window.FreeMixGtQr.render(el,val);else{el.replaceChildren();el.dataset.qrError='QR: encoder local indisponível';}}else if(el.classList.contains('gt-image')){const raw=assetMap[val]||val;if(!raw||raw.split('/').some(p=>p==='..')||/^(?:https?:|javascript:)/i.test(raw))continue;el.style.backgroundImage=['url','(',JSON.stringify(raw),')'].join('');}else if(el.classList.contains('gt-ticker-wrapper'))el.querySelector('.gt-ticker-content').textContent=val;else el.textContent=val;}}
window.FreeMixTitle={data:fields,updateFields:update,transitionIn(){animate('TransitionIn')},transitionOut(){animate('TransitionOut')},warnings:[]};window.FreeMixGCCompatibility={version:1,animation:true,clock:false,style:false};window.GC={configure(t){timeline=t||{}},play(d){update(d);animate('TransitionIn')},stop(){animate('TransitionOut')},update};window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data)return;if(e.data.action==='UPDATE_FIELDS')update(e.data.payload);if(e.data.action==='TRANSITION_IN')animate('TransitionIn');if(e.data.action==='TRANSITION_OUT')animate('TransitionOut')});
update(Object.fromEntries(fields.filter(f=>f.type==='qrcode').map(f=>[f.id,f.default])));
const clockFormats=new Map(fields.filter(f=>f.type!=='qrcode'&&/^{0:(?:HH|hh):mm(?::ss)?(?: tt)?}$/.test(f.default)).map(f=>[f.id,f.default.slice(3,-1)]));function tickClocks(){const now=new Date();for(const [name,format]of clockFormats){const hour=format.includes('hh')?(now.getHours()%12||12):now.getHours(),text=format.replace(/HH|hh/g,String(hour).padStart(2,'0')).replace('mm',String(now.getMinutes()).padStart(2,'0')).replace('ss',String(now.getSeconds()).padStart(2,'0')).replace('tt',now.getHours()<12?'AM':'PM');for(const el of document.querySelectorAll('[data-field-name]'))if(el.dataset.fieldName===name&&!el.classList.contains('gt-qrcode'))el.textContent=text;}}if(clockFormats.size){tickClocks();setInterval(tickClocks,1000);}
